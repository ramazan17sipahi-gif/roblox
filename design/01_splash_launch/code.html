<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<title>Studio Splash</title>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-studio-paper {
            background-color: #F6F6F3;
        }
        /* Editorial Motion Shapes */
        .blur-blob {
            position: absolute;
            filter: blur(100px);
            z-index: 0;
            opacity: 0.4;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-studio-paper font-body text-on-surface selection:bg-primary-container/30 overflow-hidden">
<!-- Splash Screen Container (iPhone 15 Pro Ratio) -->
<main class="relative h-screen w-full max-w-[430px] mx-auto overflow-hidden bg-studio-paper flex flex-col items-center justify-center">
<!-- Abstract Background Elements -->
<div class="blur-blob w-72 h-72 bg-primary-fixed/20 -top-20 -left-20 rounded-full"></div>
<div class="blur-blob w-96 h-96 bg-surface-variant/40 -bottom-20 -right-20 rounded-full"></div>
<div class="blur-blob w-64 h-64 bg-primary-fixed/10 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 rounded-full"></div>
<!-- Content Overlay (The Studio Canvas) -->
<div class="relative z-10 flex flex-col items-center">
<!-- Minimal Abstract Orange Logo Mark -->
<div class="w-24 h-24 mb-10 flex items-center justify-center relative">
<!-- Outer Ring Layer -->
<div class="absolute inset-0 border-[6px] border-primary-fixed/10 rounded-lg transform rotate-12"></div>
<!-- Inner Geometric Focus -->
<div class="w-16 h-16 bg-gradient-to-br from-primary-fixed to-primary flex items-center justify-center rounded-lg shadow-lg">
<span class="material-symbols-outlined text-white text-4xl" data-icon="auto_awesome" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
</div>
<!-- Brand Identity -->
<div class="text-center space-y-3">
<h1 class="font-headline text-4xl font-extrabold tracking-tighter text-on-background">
                    Studio
                </h1>
<p class="font-label text-sm uppercase tracking-[0.2em] text-on-surface-variant/70 font-bold">
                    Create, edit, publish.
                </p>
</div>
</div>
<!-- Progress Indicator (Minimal/Fast Feel) -->
<div class="absolute bottom-16 w-12 h-[2px] bg-surface-container-high overflow-hidden rounded-full">
<div class="h-full bg-primary-fixed w-1/2 animate-pulse"></div>
</div>
<!-- Decorative "Creator" Texture -->
<div class="absolute bottom-8 left-0 w-full px-12 flex justify-between opacity-10 pointer-events-none">
<span class="material-symbols-outlined text-xl" data-icon="videocam">videocam</span>
<span class="material-symbols-outlined text-xl" data-icon="grid_view">grid_view</span>
<span class="material-symbols-outlined text-xl" data-icon="brush">brush</span>
<span class="material-symbols-outlined text-xl" data-icon="send">send</span>
</div>
<!-- Invisible Nav Suppression for Splash Logic -->
</main>
<!-- Content Card for visual grounding in larger browser viewports -->
<div class="hidden lg:block fixed top-10 left-10 max-w-xs space-y-4">
<div class="bg-surface-container-lowest p-6 rounded-lg shadow-sm border border-outline-variant/10">
<h3 class="font-headline font-bold text-lg mb-2">Editorial Studio Design</h3>
<p class="text-sm text-on-surface-variant">This splash screen utilizes tonal layering and high-energy accents. The vivid orange #FF6A1A (primary-fixed) is used to create a tangible "Action" focal point against the #F6F6F3 paper base.</p>
</div>
</div>
<!-- Background Image Strategy (If needed for texture) -->
<div class="fixed inset-0 -z-10 bg-studio-paper opacity-50" data-alt="ultra subtle fine paper grain texture with soft warm lighting for professional studio feel" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuD5WjkSQQehQGT3gyRzbpRxY6LBkDqrHOGjAwVOUk7HZB5Zx4vA6SyUEa262TP7LgyT2Dvsol1jtvod-6BJHpqaWikS6VPCmizovrxdscYzd0OxqPpR-a00maDpW4oqOFKO-HEw1Ub_9gP5gDwPsn99GnwtVngodUCEwrDdOFQjrL1NhXZXDpxPsBgotAJuDCm2uYZS9kwrTJ2Blw6fEIwbDyVWE1G6sVK33vOTLqJzcnD6TMIWru9cCMwN6JjGlXHSas28MtvlEvBJ')"></div>
