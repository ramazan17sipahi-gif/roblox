<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>3D Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #f0f0f3; touch-action: none; }
  #canvas3d { width: 100vw; height: 100vh; display: block; }
  #env-label {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.5); color: #fff; padding: 4px 12px;
    border-radius: 12px; font: 10px/1 system-ui; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="canvas3d"></canvas>
<div id="env-label">Studio</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ─── Setup ───────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas3d');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf0f0f3);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(2.5, 2.0, 4.0); // Front view: R15 GLB faces +Z → camera at +Z sees front

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1;
controls.maxDistance = 8;
controls.update();

// ─── Lighting ─────────────────────────────────────────────────────────
let ambientLight, dirLight1, dirLight2, rimLight;

const environments = {
  studio: {
    bg: 0xf0f0f3,
    ambient: { color: 0xffffff, intensity: 0.35 },
    dir1: { color: 0xffffff, intensity: 1.8, pos: [3, 4, 2] },
    dir2: { color: 0xc8d8ff, intensity: 0.6, pos: [-3, 2, -2] },
    rim: { color: 0xaaccff, intensity: 0.5, pos: [0, 3, -4] },
  },
  outdoor: {
    bg: 0xddeeff,
    ambient: { color: 0x87CEEB, intensity: 0.7 },
    dir1: { color: 0xFFF8E1, intensity: 1.2, pos: [3, 5, 2] },
    dir2: { color: 0x87CEEB, intensity: 0.5, pos: [-2, 1, -1] },
    rim: { color: 0xffcc80, intensity: 0.2, pos: [0, 2, -3] },
  },
  sunset: {
    bg: 0x2C1810,
    ambient: { color: 0xFF6B35, intensity: 0.4 },
    dir1: { color: 0xFF8C00, intensity: 1.5, pos: [4, 2, 1] },
    dir2: { color: 0xFF4500, intensity: 0.6, pos: [-1, 1, -2] },
    rim: { color: 0xFFD700, intensity: 0.4, pos: [0, 3, -2] },
  },
  neon: {
    bg: 0x0a0a1a,
    ambient: { color: 0x1a1a2e, intensity: 0.3 },
    dir1: { color: 0x00E5FF, intensity: 1.0, pos: [3, 2, 2] },
    dir2: { color: 0xFF00FF, intensity: 0.8, pos: [-3, 1, -1] },
    rim: { color: 0x69F0AE, intensity: 0.5, pos: [0, 3, -3] },
  },
};

function setupLighting(envName) {
  const env = environments[envName] || environments.studio;
  scene.background = new THREE.Color(env.bg);

  if (ambientLight) scene.remove(ambientLight);
  if (dirLight1) scene.remove(dirLight1);
  if (dirLight2) scene.remove(dirLight2);
  if (rimLight) scene.remove(rimLight);

  ambientLight = new THREE.AmbientLight(env.ambient.color, env.ambient.intensity);
  dirLight1 = new THREE.DirectionalLight(env.dir1.color, env.dir1.intensity);
  dirLight1.position.set(...env.dir1.pos);
  dirLight1.castShadow = true;
  dirLight1.shadow.mapSize.width = 1024;
  dirLight1.shadow.mapSize.height = 1024;
  dirLight1.shadow.camera.near = 0.1;
  dirLight1.shadow.camera.far = 20;
  dirLight1.shadow.camera.left = -4;
  dirLight1.shadow.camera.right = 4;
  dirLight1.shadow.camera.top = 4;
  dirLight1.shadow.camera.bottom = -4;
  dirLight1.shadow.bias = -0.002;
  dirLight2 = new THREE.DirectionalLight(env.dir2.color, env.dir2.intensity);
  dirLight2.position.set(...env.dir2.pos);
  rimLight = new THREE.DirectionalLight(env.rim.color, env.rim.intensity);
  rimLight.position.set(...env.rim.pos);

  scene.add(ambientLight, dirLight1, dirLight2, rimLight);

  // Ground shadow plane
  if (!scene.getObjectByName('groundPlane')) {
    const groundGeo = new THREE.PlaneGeometry(10, 10);
    const groundMat = new THREE.ShadowMaterial({ opacity: 0.15 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.name = 'groundPlane';
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    ground.receiveShadow = true;
    scene.add(ground);
  }

  document.getElementById('env-label').textContent = envName.charAt(0).toUpperCase() + envName.slice(1);
}

setupLighting('studio');

// ─── Model & Attachment Architecture ──────────────────────────────────
let currentModel = null;
let currentTexture = null;
let modelBounds = null; // Cached bounding box of the loaded mannequin
const loader = new GLTFLoader();

// Attached accessories keyed by slotId
const attachedAccessories = {};

// ─── UV GUARD STATE ──────────────────────────────────────────────────
// Must be 'pass' before applyClassicTexture is allowed.
// Set by validateR15UVMapping() after model load.
let _uvGuardStatus = 'pending'; // 'pending' | 'pass' | 'fail'
let _mannequinSource = 'unknown'; // 'glb' | 'procedural' | 'unknown'
let _partUVBounds = {};  // Populated by UV guard: { partName: { uMin, vMin, uMax, vMax } }

// ─── EXPORT TO WINDOW for Dart-injected JS ───────────────────────────
window.THREE = THREE;
window._scene = scene;
window._camera = camera;
window._controls = controls;
window._renderer = renderer;
window._currentModel = { get: () => currentModel, set: (m) => { currentModel = m; } };
window._modelBounds = { get: () => modelBounds, set: (b) => { modelBounds = b; } };
window._loader = loader;

// Slot offsets are expressed in MODEL-LOCAL coordinates (post-scale).
// These are fallback offsets when no named bone is found in the GLB.
// Values represent fraction of model height so they adapt to any mesh.
const SLOT_FRACTION = {
  head:           { xF: 0,     yF: 0.92, zF: 0    },
  face:           { xF: 0,     yF: 0.85, zF: 0.12 },
  neck:           { xF: 0,     yF: 0.75, zF: 0    },
  shoulder:       { xF: 0.35,  yF: 0.72, zF: 0    },
  shoulder_left:  { xF: 0.35,  yF: 0.72, zF: 0    },
  shoulder_right: { xF: -0.35, yF: 0.72, zF: 0    },
  torso:          { xF: 0,     yF: 0.55, zF: 0.1  },
  front:          { xF: 0,     yF: 0.55, zF: 0.12 },
  back:           { xF: 0,     yF: 0.6,  zF: -0.12},
  waist:          { xF: 0,     yF: 0.4,  zF: 0    },
  feet:           { xF: 0,     yF: 0.05, zF: 0    },
};

// Bone name search patterns per slot (for GLBs that have named bones)
const BONE_NAMES = {
  head:     ['Head', 'head', 'HEAD', 'HeadTop_End', 'helmet', 'Skull', 'mixamorigHead', 'mixamorigHeadTop'],
  face:     ['Head', 'head', 'FaceCenter'],
  neck:     ['Neck', 'neck', 'NeckRigAttachment'],
  shoulder: ['RightUpperArm', 'LeftUpperArm', 'RightCollar'],
  back:     ['UpperTorso', 'Spine2', 'BackCenter'],
  torso:    ['UpperTorso', 'Torso', 'HumanoidRootPart'],
  front:    ['UpperTorso', 'Torso'],
  waist:    ['LowerTorso', 'Hips', 'WaistCenter'],
  feet:     ['LeftFoot', 'RightFoot'],
};

/// Find the best parent node in the model for a given slot.
/// Returns null if no suitable bone is found (will use fallback offset).
function findAttachNode(slot) {
  if (!currentModel) return null;
  const names = BONE_NAMES[slot] || BONE_NAMES['head'] || [];
  // Pass 1: Exact name match
  for (const name of names) {
    const found = currentModel.getObjectByName(name);
    if (found) return found;
  }
  // Pass 2: Case-insensitive fuzzy match (for non-standard GLB naming)
  const lowerNames = names.map(n => n.toLowerCase());
  let fuzzyResult = null;
  currentModel.traverse((node) => {
    if (fuzzyResult) return;
    if (!node.name) return;
    const lName = node.name.toLowerCase();
    for (const ln of lowerNames) {
      if (lName.includes(ln) || ln.includes(lName)) {
        fuzzyResult = node;
        console.log('[findAttachNode] Fuzzy match:', node.name, '≈', ln);
        return;
      }
    }
  });
  return fuzzyResult;
}

/// Compute the WORLD-SPACE position for a slot based on model bounds.
/// Returns {x, y, z} in world coords. DO NOT apply localToWorld after this.
function computeSlotOffset(slot) {
  const frac = SLOT_FRACTION[slot] || SLOT_FRACTION['head'];
  if (!modelBounds) return { x: frac.xF, y: frac.yF * 2, z: frac.zF };
  const min = modelBounds.min;
  const size = modelBounds.getSize(new THREE.Vector3());
  return {
    x: min.x + frac.xF * size.x + size.x * 0.5,  // center + xF offset
    y: min.y + frac.yF * size.y,                    // bottom + fraction
    z: min.z + frac.zF * size.z + size.z * 0.5,    // center + zF offset
  };
}

// ─── HARD CONTRACT: Roblox R15 Classic Clothing Part Mapping ─────────
// These whitelists are the SINGLE SOURCE OF TRUTH for body part → clothing layer mapping.
const SHIRT_PARTS = ['UpperTorso', 'LowerTorso', 'LeftUpperArm', 'LeftLowerArm', 'RightUpperArm', 'RightLowerArm'];
const PANTS_PARTS = ['LowerTorso', 'LeftUpperLeg', 'LeftLowerLeg', 'RightUpperLeg', 'RightLowerLeg'];
const SKIN_PARTS  = ['Head', 'LeftHand', 'RightHand', 'LeftFoot', 'RightFoot'];
const ALL_CLOTHING_PARTS = [...new Set([...SHIRT_PARTS, ...PANTS_PARTS])];
const ALL_KNOWN_PARTS = [...new Set([...ALL_CLOTHING_PARTS, ...SKIN_PARTS])];
// Legacy alias for accessory pipeline backward compat
const CLOTHING_EXCLUDE = SKIN_PARTS;

// Neutral skin tone for non-clothed body parts (neutral grey — matches original mannequin)
const SKIN_COLOR = new THREE.Color(0xA3A3A3);

// ─── PART RESOLVER ───────────────────────────────────────────────────
// Walk the parent chain to find the R15 body part name.
// Returns the first known R15 part name, or null if not under any known part.
function resolveBodyPart(node) {
  var current = node;
  while (current) {
    if (current.name && ALL_KNOWN_PARTS.indexOf(current.name) !== -1) {
      return current.name;
    }
    current = current.parent;
  }
  return null;
}

// Classify a resolved part name into its layer.
function classifyPart(partName) {
  if (!partName) return 'unknown';
  if (SKIN_PARTS.indexOf(partName) !== -1) return 'skin';
  if (ALL_CLOTHING_PARTS.indexOf(partName) !== -1) return 'clothing';
  return 'unknown';
}

// Apply neutral baseline materials to the entire mannequin.
// Skin parts get SKIN_COLOR, clothing parts get white (texture-ready).
function applyNeutralBaseline() {
  if (!currentModel) return;
  console.log('[baseline] Applying neutral mannequin materials...');
  var skinCount = 0, clothingCount = 0, unknownCount = 0;
  currentModel.traverse(function(child) {
    if (!child.isMesh) return;
    var part = resolveBodyPart(child);
    var cls = classifyPart(part);
    if (cls === 'skin') {
      child.material = new THREE.MeshStandardMaterial({
        color: SKIN_COLOR, roughness: 0.7, metalness: 0.0,
      });
      skinCount++;
    } else if (cls === 'clothing') {
      child.material = new THREE.MeshStandardMaterial({
        color: new THREE.Color(0xFFFFFF), roughness: 0.6, metalness: 0.05,
      });
      clothingCount++;
    } else {
      child.material = new THREE.MeshStandardMaterial({
        color: new THREE.Color(0xCCCCCC), roughness: 0.6, metalness: 0.05,
      });
      unknownCount++;
      console.warn('[baseline] Unknown part: mesh=' + child.name + ' parent=' + (child.parent ? child.parent.name : 'none'));
    }
    child.material.needsUpdate = true;
  });
  console.log('[baseline] Applied: ' + skinCount + ' skin, ' + clothingCount + ' clothing, ' + unknownCount + ' unknown');
}

function applyTextureToModel(texture) {
  if (!currentModel) return;
  texture.flipY = false;
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;
  var applied = 0, skinProtected = 0, unknownSkipped = 0;
  currentModel.traverse(function(child) {
    if (!child.isMesh) return;
    var part = resolveBodyPart(child);
    var cls = classifyPart(part);
    if (cls === 'skin') { skinProtected++; return; }
    if (cls === 'unknown') {
      unknownSkipped++;
      console.warn('[applyTexture] SKIP unknown: mesh=' + child.name + ' parent=' + (child.parent ? child.parent.name : ''));
      return;
    }
    child.material = new THREE.MeshStandardMaterial({
      map: texture,
      color: new THREE.Color(0xFFFFFF),
      roughness: 0.6, metalness: 0.05,
      transparent: false, opacity: 1.0,
      depthWrite: true, side: THREE.FrontSide,
    });
    child.material.needsUpdate = true;
    applied++;
  });
  console.log('[applyTexture] applied=' + applied + ' skinProtected=' + skinProtected + ' unknown=' + unknownSkipped);
}

// ─── API (called from Flutter) ───────────────────────────────────────

// ─── UV GUARD: Runtime R15 UV Validation ─────────────────────────────
// Validates that every R15 clothing body part has proper UV attributes.
// Called once after finalizeModel(). Result stored in _uvGuardStatus.
const UV_GUARD_PARTS = [
  'Head', 'UpperTorso', 'LowerTorso',
  'LeftUpperArm', 'LeftLowerArm', 'RightUpperArm', 'RightLowerArm',
  'LeftUpperLeg', 'LeftLowerLeg', 'RightUpperLeg', 'RightLowerLeg',
];

function validateR15UVMapping() {
  if (!currentModel) {
    _uvGuardStatus = 'fail';
    console.error('[uv-guard] FAIL: no model loaded');
    return false;
  }
  var results = [];
  var allPass = true;
  var meshesChecked = 0;
  _partUVBounds = {};  // Reset per-part UV bounds

  UV_GUARD_PARTS.forEach(function(partName) {
    var partNode = currentModel.getObjectByName(partName);
    if (!partNode) {
      results.push({ part: partName, status: 'MISSING_NODE' });
      // Not a hard fail — some GLBs flatten hierarchy. Check meshes.
      return;
    }
    var partMeshes = [];
    partNode.traverse(function(child) {
      if (child.isMesh) partMeshes.push(child);
    });
    if (partMeshes.length === 0) {
      results.push({ part: partName, status: 'NO_MESH', meshCount: 0 });
      return;
    }
    partMeshes.forEach(function(mesh) {
      meshesChecked++;
      var uv = mesh.geometry ? mesh.geometry.attributes.uv : null;
      if (!uv) {
        results.push({ part: partName, mesh: mesh.name, status: 'NO_UV' });
        allPass = false;
        return;
      }
      var arr = uv.array;
      var minU = Infinity, maxU = -Infinity, minV = Infinity, maxV = -Infinity;
      for (var i = 0; i < arr.length; i += 2) {
        if (arr[i] < minU) minU = arr[i];
        if (arr[i] > maxU) maxU = arr[i];
        if (arr[i+1] < minV) minV = arr[i+1];
        if (arr[i+1] > maxV) maxV = arr[i+1];
      }
      var inRange = (minU >= -0.01 && maxU <= 1.01 && minV >= -0.01 && maxV <= 1.01);
      var vtxCount = arr.length / 2;
      results.push({
        part: partName, mesh: mesh.name, status: inRange ? 'OK' : 'OUT_OF_RANGE',
        uvMin: [+minU.toFixed(4), +minV.toFixed(4)],
        uvMax: [+maxU.toFixed(4), +maxV.toFixed(4)],
        vertices: vtxCount,
      });
      // Store UV bounds for atlas re-baking in applyClassicTexture
      if (inRange) {
        _partUVBounds[partName] = { uMin: minU, vMin: minV, uMax: maxU, vMax: maxV };
      }
      if (!inRange) allPass = false;
    });
  });

  // Also check: is it a BoxGeometry with DEFAULT (wrong) UV?
  // Default BoxGeometry UV: EVERY face spans exactly (0,0)→(1,1).
  // Classic UV mannequin has custom sub-region UV per face → different per-face ranges.
  // Detection: count boxes where ALL 6 faces individually span [0..1] in both U and V.
  var defaultBoxGeoCount = 0;
  currentModel.traverse(function(child) {
    if (!child.isMesh) return;
    var geo = child.geometry;
    if (!geo) return;
    var uv = geo.attributes.uv;
    if (!uv) return;
    if (uv.count === 24) {
      var arr = uv.array;
      // Check if ALL 6 faces individually span the full [0,1] range
      // Default BoxGeo: each face has verts at (0,0),(1,0),(0,1),(1,1)
      // Custom UV: each face maps to a sub-region (e.g., 0.18-0.55, 0-0.31)
      var allFacesFullRange = true;
      for (var face = 0; face < 6; face++) {
        var fi = face * 8; // 4 verts × 2 components
        var fMinU = Infinity, fMaxU = -Infinity;
        var fMinV = Infinity, fMaxV = -Infinity;
        for (var v = 0; v < 4; v++) {
          var uu = arr[fi + v * 2];
          var vv = arr[fi + v * 2 + 1];
          if (uu < fMinU) fMinU = uu;
          if (uu > fMaxU) fMaxU = uu;
          if (vv < fMinV) fMinV = vv;
          if (vv > fMaxV) fMaxV = vv;
        }
        // Full range = face spans ~0 to ~1 in BOTH axes
        if (!(Math.abs(fMinU) < 0.02 && Math.abs(fMaxU - 1.0) < 0.02 &&
              Math.abs(fMinV) < 0.02 && Math.abs(fMaxV - 1.0) < 0.02)) {
          allFacesFullRange = false;
          break;
        }
      }
      if (allFacesFullRange) defaultBoxGeoCount++;
    }
  });
  var isDefaultBoxGeo = (defaultBoxGeoCount >= 8);
  if (isDefaultBoxGeo) {
    allPass = false;
    console.warn('[uv-guard] DETECTED default BoxGeometry UV (' + defaultBoxGeoCount + ' default-UV boxes). Classic clothing mannequin should use custom UV.');
  }

  _uvGuardStatus = allPass ? 'pass' : 'fail';
  console.log('[uv-guard] ' + _uvGuardStatus.toUpperCase() + ' meshesChecked=' + meshesChecked +
    ' boxGeoDetected=' + isDefaultBoxGeo + ' results:', JSON.stringify(results));

  // Emit telemetry
  console.log('[classic-init] mannequinSource=' + _mannequinSource + ' uvGuard=' + _uvGuardStatus +
    ' classicApplyEnabled=' + (_uvGuardStatus === 'pass'));

  // Notify Flutter
  window.flutter_inappwebview?.callHandler('onUVGuardResult', _uvGuardStatus);
  return allPass;
}

window.getUVGuardStatus = function() { return _uvGuardStatus; };

// ─── CANONICAL CLASSIC CLOTHING PIPELINE ─────────────────────────────
// SINGLE entry point for ALL classic clothing texture application.
// mode: 'shirt' | 'pants' | 'set' | 'tshirt'
// Both Editor and Preview MUST call this — no alternative paths.
//
// STRATEGY: FULL_TEMPLATE + UV_REWRITE
// The R15 GLB has Sketchfab UV that doesn't match the Roblox template.
// Solution: Use the full 585×559 template as-is, and REWRITE each mesh's
// UV coordinates to point at the correct region in the template.
//
// This avoids atlas rebaking AND preserves the original template pixel data.
// Each mesh face gets UV coords that reference the right face in the template.
//
// ROBLOX 585×559 TEMPLATE — VERIFIED PIXEL COORDINATES (from DevForum R15 UV guide):
// ┌─────────────────────────────────────────────────────┐
// │ TORSO:                                              │
// │   UP:    (151, 0,  128, 64)  — top of head/neck     │
// │   R:     ( 73, 74,  64,128)  — right side            │
// │   FRONT: (137, 74, 128,128)  — chest                 │
// │   L:     (265, 74,  64,128)  — left side             │
// │   BACK:  (329, 74, 128,128)  — back                  │
// │   DOWN:  (151,203, 128, 64)  — waist                 │
// ├─────────────────────────────────────────────────────┤
// │ RIGHT ARM/LEG:                                      │
// │   U:     ( 74,273,  64, 64) — shoulder/hip cap       │
// │   Row:   ( 10,341, 256,128) — R(64)+F(64)+L(64)+B(64)│
// │   D:     ( 74,470,  64, 64) — hand/foot cap          │
// ├─────────────────────────────────────────────────────┤
// │ LEFT ARM/LEG:                                       │
// │   U:     (341,273,  64, 64) — shoulder/hip cap       │
// │   Row:   (277,341, 256,128) — R(64)+F(64)+L(64)+B(64)│
// │   D:     (341,470,  64, 64) — hand/foot cap          │
// └─────────────────────────────────────────────────────┘

// ─── setViewAngle: orbit camera to front/back view ─────────────────────
// 0° = front (camera at +Z), 180° = back (camera at -Z)
window.setViewAngle = function(angleDeg) {
  var rad = angleDeg * Math.PI / 180;
  var dist = camera.position.length();
  var newZ = dist * Math.cos(rad);
  var newX = dist * Math.sin(rad);
  camera.position.set(newX, camera.position.y, newZ);
  camera.lookAt(controls.target);
  controls.update();
  console.log('[setViewAngle] angle=' + angleDeg + ' camZ=' + newZ.toFixed(2));
};

window.applyClassicTexture = function(base64PNG, mode, opToken) {
  opToken = opToken || 0;
  if (!currentModel) {
    console.warn('[applyClassicTexture] No model loaded.');
    return;
  }
  if (_uvGuardStatus !== 'pass') {
    console.error('[applyClassicTexture] BLOCKED by UV guard. Status=' + _uvGuardStatus);
    window.flutter_inappwebview?.callHandler('onClassicTextureBlocked', _uvGuardStatus);
    return;
  }
  var validModes = ['shirt', 'pants', 'set', 'tshirt'];
  if (validModes.indexOf(mode) === -1) {
    console.error('[applyClassicTexture] Invalid mode: ' + mode);
    return;
  }

  var t0 = performance.now();
  console.log('[perf] op=clothing_apply start mode=' + mode + ' token=' + opToken);

  var img = new Image();
  img.onload = function() {
    currentTexture = null;
    var TW = 585.0;
    var TH = 559.0;

    var targetParts;
    if (mode === 'shirt')       targetParts = SHIRT_PARTS;
    else if (mode === 'pants')  targetParts = PANTS_PARTS;
    else if (mode === 'set')    targetParts = ALL_CLOTHING_PARTS;
    else if (mode === 'tshirt') targetParts = ['UpperTorso'];

    // ─── FRONT/BACK ORIENTATION ─────────────────────────────────────────
    // Detect model forward direction by sampling UpperTorso mesh normals.
    // This is a GROUND-TRUTH measurement — not an assumption from attachments.
    var forwardZ = 1;
    var _uvFaceMapSource = 'default_plus_z';

    // Strategy: Sample normals from the torso mesh. Front-facing vertices
    // have normals pointing outward from the front surface. If the model
    // faces +Z, majority of Z-dominant normals will have nz > 0.
    var torsoMesh = null;
    currentModel.traverse(function(node) {
      if (!torsoMesh && node.isMesh && node.name &&
          (node.name === 'UpperTorso' || node.name.indexOf('UpperTorso') !== -1 ||
           node.name === 'Torso' || node.name.indexOf('torso') !== -1)) {
        torsoMesh = node;
      }
    });

    if (torsoMesh && torsoMesh.geometry && torsoMesh.geometry.attributes.normal) {
      torsoMesh.updateMatrixWorld(true);
      var nMatrix = new THREE.Matrix3().getNormalMatrix(torsoMesh.matrixWorld);
      var normals = torsoMesh.geometry.attributes.normal;
      var zPosCount = 0, zNegCount = 0;
      var _sampleNorm = new THREE.Vector3();

      for (var si = 0; si < normals.count; si++) {
        _sampleNorm.set(normals.getX(si), normals.getY(si), normals.getZ(si));
        _sampleNorm.applyMatrix3(nMatrix).normalize();
        // Only count Z-dominant normals (front/back faces, not top/side)
        if (Math.abs(_sampleNorm.z) > Math.abs(_sampleNorm.x) &&
            Math.abs(_sampleNorm.z) > Math.abs(_sampleNorm.y)) {
          if (_sampleNorm.z > 0) zPosCount++;
          else zNegCount++;
        }
      }

      if (zPosCount + zNegCount > 0) {
        // R15 models have nearly equal front/back vertex counts.
        // Only override the default +1 if there's a DECISIVE difference (>30%).
        // zPos=22 vs zNeg=30 is noise — keep default +1 for standard R15.
        var total = zPosCount + zNegCount;
        var dominantCount = Math.max(zPosCount, zNegCount);
        var ratio = dominantCount / total;  // 0.5 = even split, 1.0 = all one side
        
        if (ratio > 0.65) {
          // Decisive: one side has >65% of Z-dominant normals
          forwardZ = zPosCount >= zNegCount ? 1 : -1;
          _uvFaceMapSource = 'mesh_normal_decisive';
        } else {
          // Ambiguous: keep R15 default of +1
          forwardZ = 1;
          _uvFaceMapSource = 'default_r15_ambiguous';
        }
        console.log('[uv-orient-detail] torso=' + torsoMesh.name +
          ' zPos=' + zPosCount + ' zNeg=' + zNegCount +
          ' ratio=' + ratio.toFixed(2) +
          ' → forwardZ=' + forwardZ + ' source=' + _uvFaceMapSource);
      }
    }
    console.log('[uv-orient] forwardZ=' + forwardZ + ' source=' + _uvFaceMapSource + ' mannequin=' + _mannequinSource);

    // ─── PART_FACES with R15 splits ──────────────────────────────────
    // From actual pixel scan of template-1/Shirt.png (585×559).
    var TORSO_Y = 73;
    var TORSO_H = 130;
    var TORSO = {
      right: { x: 164, y: TORSO_Y, w: 66, h: TORSO_H },
      front: { x: 231, y: TORSO_Y, w: 130, h: TORSO_H },
      left:  { x: 362, y: TORSO_Y, w: 64, h: TORSO_H },
      back:  { x: 427, y: TORSO_Y, w: 130, h: TORSO_H },
      up:    { x: 231, y: 7, w: 130, h: 65 },
      down:  { x: 231, y: 204, w: 130, h: 64 },
    };

    var RL_Y = 349;
    var RL_H = 114;
    var RIGHT_LIMB = {
      left:  { x: 18,  y: RL_Y, w: 66, h: RL_H },
      back:  { x: 85,  y: RL_Y, w: 66, h: RL_H },
      right: { x: 151, y: RL_Y, w: 66, h: RL_H },
      front: { x: 217, y: RL_Y, w: 66, h: RL_H },
      up:    { x: 217, y: 288, w: 66, h: 62 },
      down:  null,
    };

    var LL_Y = 349;
    var LEFT_LIMB = {
      front: { x: 308, y: LL_Y, w: 66, h: RL_H },
      right: { x: 374, y: LL_Y, w: 66, h: RL_H },
      back:  { x: 440, y: LL_Y, w: 66, h: RL_H },
      left:  { x: 506, y: LL_Y, w: 66, h: RL_H },
      up:    { x: 308, y: 288, w: 66, h: 62 },
      down:  null,
    };

    // R15 splits: Upper/Lower proportions
    var UT_H = Math.round(TORSO_H * 0.75);
    var LT_H = TORSO_H - UT_H;
    var UL_H = Math.round(RL_H * 0.56);
    var LL_MH = RL_H - UL_H;

    var PART_FACES = {
      'UpperTorso': {
        right: { x: TORSO.right.x, y: TORSO_Y, w: TORSO.right.w, h: UT_H },
        front: { x: TORSO.front.x, y: TORSO_Y, w: TORSO.front.w, h: UT_H },
        left:  { x: TORSO.left.x,  y: TORSO_Y, w: TORSO.left.w,  h: UT_H },
        back:  { x: TORSO.back.x,  y: TORSO_Y, w: TORSO.back.w,  h: UT_H },
        up:    TORSO.up,
        down:  null,
      },
      'LowerTorso': {
        right: { x: TORSO.right.x, y: TORSO_Y + UT_H, w: TORSO.right.w, h: LT_H },
        front: { x: TORSO.front.x, y: TORSO_Y + UT_H, w: TORSO.front.w, h: LT_H },
        left:  { x: TORSO.left.x,  y: TORSO_Y + UT_H, w: TORSO.left.w,  h: LT_H },
        back:  { x: TORSO.back.x,  y: TORSO_Y + UT_H, w: TORSO.back.w,  h: LT_H },
        up:    null,
        down:  TORSO.down,
      },
      'RightUpperArm': {
        right: { x: RIGHT_LIMB.right.x, y: RL_Y, w: RIGHT_LIMB.right.w, h: UL_H },
        front: { x: RIGHT_LIMB.front.x, y: RL_Y, w: RIGHT_LIMB.front.w, h: UL_H },
        left:  { x: RIGHT_LIMB.left.x,  y: RL_Y, w: RIGHT_LIMB.left.w,  h: UL_H },
        back:  { x: RIGHT_LIMB.back.x,  y: RL_Y, w: RIGHT_LIMB.back.w,  h: UL_H },
        up:    RIGHT_LIMB.up,
        down:  null,
      },
      'RightLowerArm': {
        right: { x: RIGHT_LIMB.right.x, y: RL_Y + UL_H, w: RIGHT_LIMB.right.w, h: LL_MH },
        front: { x: RIGHT_LIMB.front.x, y: RL_Y + UL_H, w: RIGHT_LIMB.front.w, h: LL_MH },
        left:  { x: RIGHT_LIMB.left.x,  y: RL_Y + UL_H, w: RIGHT_LIMB.left.w,  h: LL_MH },
        back:  { x: RIGHT_LIMB.back.x,  y: RL_Y + UL_H, w: RIGHT_LIMB.back.w,  h: LL_MH },
        up:    null,
        down:  null,
      },
      'LeftUpperArm': {
        right: { x: LEFT_LIMB.right.x, y: LL_Y, w: LEFT_LIMB.right.w, h: UL_H },
        front: { x: LEFT_LIMB.front.x, y: LL_Y, w: LEFT_LIMB.front.w, h: UL_H },
        left:  { x: LEFT_LIMB.left.x,  y: LL_Y, w: LEFT_LIMB.left.w,  h: UL_H },
        back:  { x: LEFT_LIMB.back.x,  y: LL_Y, w: LEFT_LIMB.back.w,  h: UL_H },
        up:    LEFT_LIMB.up,
        down:  null,
      },
      'LeftLowerArm': {
        right: { x: LEFT_LIMB.right.x, y: LL_Y + UL_H, w: LEFT_LIMB.right.w, h: LL_MH },
        front: { x: LEFT_LIMB.front.x, y: LL_Y + UL_H, w: LEFT_LIMB.front.w, h: LL_MH },
        left:  { x: LEFT_LIMB.left.x,  y: LL_Y + UL_H, w: LEFT_LIMB.left.w,  h: LL_MH },
        back:  { x: LEFT_LIMB.back.x,  y: LL_Y + UL_H, w: LEFT_LIMB.back.w,  h: LL_MH },
        up:    null,
        down:  null,
      },
      'RightUpperLeg': {
        right: { x: RIGHT_LIMB.right.x, y: RL_Y, w: RIGHT_LIMB.right.w, h: UL_H },
        front: { x: RIGHT_LIMB.front.x, y: RL_Y, w: RIGHT_LIMB.front.w, h: UL_H },
        left:  { x: RIGHT_LIMB.left.x,  y: RL_Y, w: RIGHT_LIMB.left.w,  h: UL_H },
        back:  { x: RIGHT_LIMB.back.x,  y: RL_Y, w: RIGHT_LIMB.back.w,  h: UL_H },
        up:    RIGHT_LIMB.up,
        down:  null,
      },
      'RightLowerLeg': {
        right: { x: RIGHT_LIMB.right.x, y: RL_Y + UL_H, w: RIGHT_LIMB.right.w, h: LL_MH },
        front: { x: RIGHT_LIMB.front.x, y: RL_Y + UL_H, w: RIGHT_LIMB.front.w, h: LL_MH },
        left:  { x: RIGHT_LIMB.left.x,  y: RL_Y + UL_H, w: RIGHT_LIMB.left.w,  h: LL_MH },
        back:  { x: RIGHT_LIMB.back.x,  y: RL_Y + UL_H, w: RIGHT_LIMB.back.w,  h: LL_MH },
        up:    null,
        down:  null,
      },
      'LeftUpperLeg': {
        right: { x: LEFT_LIMB.right.x, y: LL_Y, w: LEFT_LIMB.right.w, h: UL_H },
        front: { x: LEFT_LIMB.front.x, y: LL_Y, w: LEFT_LIMB.front.w, h: UL_H },
        left:  { x: LEFT_LIMB.left.x,  y: LL_Y, w: LEFT_LIMB.left.w,  h: UL_H },
        back:  { x: LEFT_LIMB.back.x,  y: LL_Y, w: LEFT_LIMB.back.w,  h: UL_H },
        up:    LEFT_LIMB.up,
        down:  null,
      },
      'LeftLowerLeg': {
        right: { x: LEFT_LIMB.right.x, y: LL_Y + UL_H, w: LEFT_LIMB.right.w, h: LL_MH },
        front: { x: LEFT_LIMB.front.x, y: LL_Y + UL_H, w: LEFT_LIMB.front.w, h: LL_MH },
        left:  { x: LEFT_LIMB.left.x,  y: LL_Y + UL_H, w: LEFT_LIMB.left.w,  h: LL_MH },
        back:  { x: LEFT_LIMB.back.x,  y: LL_Y + UL_H, w: LEFT_LIMB.back.w,  h: LL_MH },
        up:    null,
        down:  null,
      },
    };

    // Create full-template texture
    var texCanvas = document.createElement('canvas');
    texCanvas.width = img.width;
    texCanvas.height = img.height;
    var texCtx = texCanvas.getContext('2d');
    texCtx.drawImage(img, 0, 0);
    var fullTex = new THREE.CanvasTexture(texCanvas);
    fullTex.flipY = false;
    fullTex.colorSpace = THREE.SRGBColorSpace;
    fullTex.minFilter = THREE.LinearFilter;
    fullTex.magFilter = THREE.LinearFilter;
    fullTex.wrapS = THREE.ClampToEdgeWrapping;
    fullTex.wrapT = THREE.ClampToEdgeWrapping;
    fullTex.needsUpdate = true;

    // ─── UV REWRITE HELPER ──────────────────────────────────────────────
    function rewriteUVForPart(mesh, faces) {
      var geo = mesh.geometry;
      if (!geo) return false;
      var posAttr = geo.attributes.position;
      var normalAttr = geo.attributes.normal;
      var uvAttr = geo.attributes.uv;
      if (!posAttr || !normalAttr || !uvAttr) return false;

      var localPositions = posAttr.array;
      var localNormals   = normalAttr.array;
      var uvArray = new Float32Array(uvAttr.array.length);
      var vertCount = posAttr.count;

      mesh.updateMatrixWorld(true);
      var normalMatrix = new THREE.Matrix3().getNormalMatrix(mesh.matrixWorld);

      var wMinX = Infinity, wMaxX = -Infinity;
      var wMinY = Infinity, wMaxY = -Infinity;
      var wMinZ = Infinity, wMaxZ = -Infinity;
      var _tmpPos = new THREE.Vector3();
      for (var vi = 0; vi < vertCount; vi++) {
        _tmpPos.set(localPositions[vi*3], localPositions[vi*3+1], localPositions[vi*3+2]);
        mesh.localToWorld(_tmpPos);
        if (_tmpPos.x < wMinX) wMinX = _tmpPos.x;
        if (_tmpPos.x > wMaxX) wMaxX = _tmpPos.x;
        if (_tmpPos.y < wMinY) wMinY = _tmpPos.y;
        if (_tmpPos.y > wMaxY) wMaxY = _tmpPos.y;
        if (_tmpPos.z < wMinZ) wMinZ = _tmpPos.z;
        if (_tmpPos.z > wMaxZ) wMaxZ = _tmpPos.z;
      }
      var rangeX = wMaxX - wMinX || 0.001;
      var rangeY = wMaxY - wMinY || 0.001;
      var rangeZ = wMaxZ - wMinZ || 0.001;

      var _wNorm = new THREE.Vector3();
      var _wPos  = new THREE.Vector3();

      for (var i = 0; i < vertCount; i++) {
        _wNorm.set(localNormals[i*3], localNormals[i*3+1], localNormals[i*3+2]);
        _wNorm.applyMatrix3(normalMatrix).normalize();
        var nx = _wNorm.x, ny = _wNorm.y, nz = _wNorm.z;

        _wPos.set(localPositions[i*3], localPositions[i*3+1], localPositions[i*3+2]);
        mesh.localToWorld(_wPos);
        var px = _wPos.x, py = _wPos.y, pz = _wPos.z;

        var absX = Math.abs(nx), absY = Math.abs(ny), absZ = Math.abs(nz);
        var face = null, localU = 0, localV = 0;

        if (absY >= absX && absY >= absZ) {
          if (ny > 0) {
            face = faces.up;
            localU = (px - wMinX) / rangeX;
            localV = (pz - wMinZ) / rangeZ;
          } else {
            face = faces.down;
            localU = (px - wMinX) / rangeX;
            localV = 1.0 - (pz - wMinZ) / rangeZ;
          }
        } else if (absZ >= absX && absZ >= absY) {
          if (nz * forwardZ > 0) {
            face = faces.front;
            localU = 1.0 - (px - wMinX) / rangeX;
            localV = 1.0 - (py - wMinY) / rangeY;
          } else {
            face = faces.back;
            localU = 1.0 - (px - wMinX) / rangeX;
            localV = 1.0 - (py - wMinY) / rangeY;
          }
        } else {
          if (nx > 0) {
            face = faces.right;
            localU = 1.0 - (pz - wMinZ) / rangeZ;
            localV = 1.0 - (py - wMinY) / rangeY;
          } else {
            face = faces.left;
            localU = (pz - wMinZ) / rangeZ;
            localV = 1.0 - (py - wMinY) / rangeY;
          }
        }

        if (!face) face = faces.front;
        uvArray[i * 2]     = (face.x + localU * face.w) / TW;
        uvArray[i * 2 + 1] = (face.y + localV * face.h) / TH;

        // ── DIAGNOSTIC: count face assignments ──
        if (!mesh._faceStats) mesh._faceStats = {};
        var faceLabel = 'unknown';
        if (face === faces.front) faceLabel = 'front';
        else if (face === faces.back) faceLabel = 'back';
        else if (face === faces.left) faceLabel = 'left';
        else if (face === faces.right) faceLabel = 'right';
        else if (face === faces.up) faceLabel = 'up';
        else if (face === faces.down) faceLabel = 'down';
        mesh._faceStats[faceLabel] = (mesh._faceStats[faceLabel] || 0) + 1;

        // Log first 3 front/back-dominant vertices for UpperTorso
        if (mesh._diagCount === undefined) mesh._diagCount = 0;
        if (absZ >= absX && absZ >= absY && mesh._diagCount < 6) {
          var assignedFace = (nz * forwardZ > 0) ? 'front' : 'back';
          console.log('[uv-diag] mesh=' + (mesh.name || '?') +
            ' v=' + i + ' nz=' + nz.toFixed(4) +
            ' forwardZ=' + forwardZ +
            ' nz*fwdZ=' + (nz * forwardZ).toFixed(4) +
            ' → ' + assignedFace +
            ' uvX=' + uvArray[i*2].toFixed(4) +
            ' px_x=' + (uvArray[i*2] * TW).toFixed(1));
          mesh._diagCount++;
        }
      }

      // Log face distribution summary
      console.log('[uv-face-dist] mesh=' + (mesh.name || '?') +
        ' stats=' + JSON.stringify(mesh._faceStats));
      delete mesh._faceStats;
      delete mesh._diagCount;

      geo.setAttribute('uv', new THREE.BufferAttribute(uvArray, 2));
      geo.attributes.uv.needsUpdate = true;
      return true;
    }

    // ═══════════════════════════════════════════════════════════════════
    //  PREPARE-THEN-SWAP STRATEGY
    //  Phase 1: Build all new materials WITHOUT assigning to meshes
    //  Phase 2: Single-frame swap (no naked flash)
    //  Phase 3: Dispose old materials/textures (no memory leak)
    // ═══════════════════════════════════════════════════════════════════
    var pendingSwaps = [];
    var oldDisposables = [];
    var applied = 0, skipped = 0, skinProtected = 0, unknownParts = 0;

    // ── PREPARE PHASE ──────────────────────────────────────────────────
    var tPrepare = performance.now();

    if (_mannequinSource === 'classic_uv') {
      // classic_uv fast-path: UV is pre-baked, no rewrite needed
      console.log('[texture-path] USING ORIGINAL UVs (classic_uv) mannequin=' + _mannequinSource);
      currentModel.traverse(function(child) {
        if (!child.isMesh) return;
        var part = resolveBodyPart(child);
        var isSkin = (part && SKIN_PARTS.indexOf(part) !== -1);
        var isTarget = (part && targetParts.indexOf(part) !== -1);

        if (isSkin) {
          // Skin parts: only create new material if not already skin-colored
          if (!child._isSkinMat) {
            if (child.material) oldDisposables.push(child.material);
            var skinMat = new THREE.MeshStandardMaterial({ color: SKIN_COLOR, roughness: 0.7, metalness: 0.0 });
            pendingSwaps.push({ mesh: child, material: skinMat, isSkin: true });
          }
          skinProtected++;
          return;
        }
        if (!part || !isTarget) { skipped++; return; }

        // Collect old material for disposal
        if (child.material) oldDisposables.push(child.material);

        var newMat = new THREE.MeshStandardMaterial({
          map: fullTex, color: new THREE.Color(0xFFFFFF),
          roughness: 0.6, metalness: 0.05,
          transparent: false, opacity: 1.0,
          depthWrite: true, side: THREE.FrontSide,
        });
        pendingSwaps.push({ mesh: child, material: newMat, isSkin: false });
        applied++;
      });
    } else {
      // UV_REWRITE path — only for models WITHOUT valid Roblox UVs
      console.log('[texture-path] UV REWRITE mode mannequin=' + _mannequinSource + ' uvGuard=' + _uvGuardStatus);
      currentModel.traverse(function(child) {
        if (!child.isMesh) return;
        var part = resolveBodyPart(child);
        var isSkin = (part && SKIN_PARTS.indexOf(part) !== -1);
        var isTarget = (part && targetParts.indexOf(part) !== -1);

        if (isSkin) {
          if (!child._isSkinMat) {
            if (child.material) oldDisposables.push(child.material);
            var skinMat = new THREE.MeshStandardMaterial({
              color: SKIN_COLOR, roughness: 0.7, metalness: 0.0,
              transparent: false, opacity: 1.0,
            });
            pendingSwaps.push({ mesh: child, material: skinMat, isSkin: true });
          }
          skinProtected++;
          return;
        }
        if (!part) { unknownParts++; return; }
        if (!isTarget) { skipped++; return; }

        var faces = PART_FACES[part];
        if (!faces) { skipped++; return; }

        // Geometry clone cache: only clone+rewrite UV once per mode
        if (child._uvRewrittenForMode !== mode) {
          child.geometry = child.geometry.clone();
          var ok = rewriteUVForPart(child, faces);
          if (!ok) { skipped++; return; }
          child._uvRewrittenForMode = mode;
        }

        // Collect old material for disposal
        if (child.material) oldDisposables.push(child.material);

        var newMat = new THREE.MeshStandardMaterial({
          map: fullTex, color: new THREE.Color(0xFFFFFF),
          roughness: 0.6, metalness: 0.05,
          transparent: false, opacity: 1.0,
          depthWrite: true, side: THREE.FrontSide,
        });
        pendingSwaps.push({ mesh: child, material: newMat, isSkin: false });
        applied++;
      });
    }

    console.log('[swap] texture_prepare_done mode=' + mode +
      ' meshCount=' + pendingSwaps.length +
      ' ms=' + (performance.now() - tPrepare).toFixed(1));

    // ── SWAP PHASE (single-frame assignment — no naked flash) ────────
    var tSwap = performance.now();
    for (var i = 0; i < pendingSwaps.length; i++) {
      var entry = pendingSwaps[i];
      entry.mesh.material = entry.material;
      entry.mesh.material.needsUpdate = true;
      if (entry.isSkin) entry.mesh._isSkinMat = true;
    }
    console.log('[swap] texture_swap_done mode=' + mode +
      ' applied=' + applied + ' skipped=' + skipped +
      ' skinProtected=' + skinProtected +
      ' ms=' + (performance.now() - tSwap).toFixed(1));

    // ── DISPOSE PHASE (prevent memory leaks) ─────────────────────────
    var disposedMats = 0, disposedTexs = 0;
    for (var i = 0; i < oldDisposables.length; i++) {
      var oldMat = oldDisposables[i];
      if (oldMat.map && oldMat.map !== fullTex) {
        oldMat.map.dispose();
        disposedTexs++;
      }
      oldMat.dispose();
      disposedMats++;
    }
    console.log('[perf] dispose oldMaterials=' + disposedMats + ' oldTextures=' + disposedTexs);

    var totalMs = (performance.now() - t0).toFixed(1);
    console.log('[perf] op=clothing_apply end mode=' + mode +
      ' ms=' + totalMs + ' token=' + opToken);

    // Notify Dart with token for race-safe state management
    if (window.flutter_inappwebview) {
      window.flutter_inappwebview.callHandler('onTextureSwapDone', mode, opToken);
    }
  };
  img.onerror = function(e) {
    console.error('[applyClassicTexture] Image decode failed:', e);
    if (window.flutter_inappwebview) {
      window.flutter_inappwebview.callHandler('onTextureSwapDone', mode, opToken);
    }
  };
  img.src = 'data:image/png;base64,' + base64PNG;
};

// For classic clothing, prefer applyClassicTexture(base64, mode).
window.updateTexture = function(base64PNG) {
  if (!currentModel) {
    console.warn('[updateTexture] No model loaded.');
    return;
  }
  var img = new Image();
  img.onload = function() {
    var tex = new THREE.Texture(img);
    tex.flipY = false;
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.needsUpdate = true;
    currentTexture = tex;
    applyTextureToModel(tex);
  };
  img.onerror = function(e) {
    console.error('[updateTexture] Image decode failed:', e);
  };
  img.src = 'data:image/png;base64,' + base64PNG;
};

// ─── Helper: base64 string → ArrayBuffer ─────────────────────────────
function base64ToArrayBuffer(base64) {
  const binaryString = atob(base64);
  const len = binaryString.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) {
    bytes[i] = binaryString.charCodeAt(i);
  }
  return bytes.buffer;
}

// ─── Helper: process loaded GLTF into mannequin ──────────────────────
function processLoadedModel(gltf) {
  _mannequinSource = 'glb';
  currentModel = gltf.scene;
  finalizeModel();
}

function finalizeModel() {
  const box = new THREE.Box3().setFromObject(currentModel);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const scale = 2.0 / maxDim;
  currentModel.scale.setScalar(scale);
  currentModel.position.set(0, 0, 0);
  // Re-center after scaling
  const box2 = new THREE.Box3().setFromObject(currentModel);
  const center2 = box2.getCenter(new THREE.Vector3());
  currentModel.position.x = -center2.x;
  currentModel.position.z = -center2.z;
  currentModel.position.y = -box2.min.y; // Feet on ground

  // Log all nodes for diagnostics
  const nodeNames = [];
  currentModel.traverse((node) => {
    if (node.name) nodeNames.push(node.name);
    if (node.name.indexOf('Attachment') !== -1) {
      console.log('[R15 Rig] Found attachment:', node.name, 'in', node.parent?.name);
    }
  });
  console.log('[R15 Rig] All node names:', nodeNames.join(', '));

  // ── INJECT ATTACHMENT NODES ──
  // The R15 GLB has named bones (Head, UpperTorso, etc.) but no Roblox 
  // attachment points. We inject them programmatically based on bone bbox.
  function injectAttachment(boneName, attachName, localOffset) {
    const bone = currentModel.getObjectByName(boneName);
    if (!bone) {
      console.warn('[injectAttachment] Bone not found:', boneName);
      return null;
    }
    // Check if already exists
    const existing = bone.getObjectByName(attachName);
    if (existing) return existing;
    
    const attach = new THREE.Object3D();
    attach.name = attachName;
    
    // If localOffset is 'auto', compute from bone bbox
    if (localOffset === 'top') {
      const bb = new THREE.Box3().setFromObject(bone);
      bone.worldToLocal(bb.max.clone());
      const localMax = new THREE.Vector3();
      bone.worldToLocal(bb.max.clone()).sub(bone.position);
      // Top of bone in local space
      const boneBox = new THREE.Box3().setFromObject(bone);
      const boneCenter = boneBox.getCenter(new THREE.Vector3());
      const boneSize = boneBox.getSize(new THREE.Vector3());
      bone.worldToLocal(boneCenter);
      attach.position.set(0, boneSize.y / 2 / currentModel.scale.y, 0);
    } else if (localOffset === 'front') {
      const boneBox = new THREE.Box3().setFromObject(bone);
      const boneSize = boneBox.getSize(new THREE.Vector3());
      attach.position.set(0, 0, boneSize.z / 2 / currentModel.scale.z);
    } else if (localOffset === 'back') {
      const boneBox = new THREE.Box3().setFromObject(bone);
      const boneSize = boneBox.getSize(new THREE.Vector3());
      attach.position.set(0, 0, -boneSize.z / 2 / currentModel.scale.z);
    } else if (Array.isArray(localOffset)) {
      attach.position.set(localOffset[0], localOffset[1], localOffset[2]);
    }
    
    bone.add(attach);
    console.log('[injectAttachment] Added', attachName, 'to', boneName, 'at', attach.position.toArray().map(v => v.toFixed(3)));
    return attach;
  }

  // Head attachments
  injectAttachment('Head', 'HatAttachment', 'top');
  injectAttachment('Head', 'HairAttachment', 'top');
  injectAttachment('Head', 'FaceFrontAttachment', 'front');
  injectAttachment('Head', 'FaceCenterAttachment', [0, 0, 0]);
  // Neck — between Head and UpperTorso
  injectAttachment('UpperTorso', 'NeckAttachment', 'top');
  // Torso
  injectAttachment('UpperTorso', 'BodyFrontAttachment', 'front');
  injectAttachment('UpperTorso', 'BodyBackAttachment', 'back');
  // Waist
  injectAttachment('LowerTorso', 'WaistCenterAttachment', [0, 0, 0]);
  injectAttachment('LowerTorso', 'WaistFrontAttachment', 'front');
  injectAttachment('LowerTorso', 'WaistBackAttachment', 'back');
  // Shoulders
  injectAttachment('RightUpperArm', 'RightCollarAttachment', 'top');
  injectAttachment('LeftUpperArm', 'LeftCollarAttachment', 'top');

  scene.add(currentModel);

  // Cache bounds for slot offset calculations
  modelBounds = new THREE.Box3().setFromObject(currentModel);

  // ── CACHE BODY PART DIMENSIONS ──
  // Measure every R15 body part in WORLD space after scaling.
  // This is used by attachAccessory to scale accessories per-slot.
  window._bodyPartBounds = {};
  const partNames = [
    'Head', 'UpperTorso', 'LowerTorso',
    'LeftUpperArm', 'LeftLowerArm', 'LeftHand',
    'RightUpperArm', 'RightLowerArm', 'RightHand',
    'LeftUpperLeg', 'LeftLowerLeg', 'LeftFoot',
    'RightUpperLeg', 'RightLowerLeg', 'RightFoot',
  ];
  partNames.forEach(name => {
    const node = currentModel.getObjectByName(name);
    if (!node) return;
    const box = new THREE.Box3().setFromObject(node);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    window._bodyPartBounds[name] = {
      box, size, center,
      width: size.x, height: size.y, depth: size.z,
      minY: box.min.y, maxY: box.max.y,
    };
  });
  // Log body dimensions for verification
  const dimLog = {};
  Object.keys(window._bodyPartBounds).forEach(k => {
    const b = window._bodyPartBounds[k];
    dimLog[k] = { w: +b.width.toFixed(3), h: +b.height.toFixed(3), d: +b.depth.toFixed(3), minY: +b.minY.toFixed(3), maxY: +b.maxY.toFixed(3) };
  });
  console.log('[R15 Body] Part dimensions:', JSON.stringify(dimLog));

  // Slot → body part mapping for accessory scaling
  window._slotToBodyPart = {
    'head': 'Head',
    'face': 'Head',
    'neck': 'UpperTorso',
    'front': 'UpperTorso',
    'back': 'UpperTorso',
    'waist': 'LowerTorso',
    'shoulder': 'RightUpperArm',
  };

  if (currentTexture) {
    applyTextureToModel(currentTexture);
  } else {
    // No texture yet — apply neutral baseline so mannequin looks clean
    applyNeutralBaseline();
  }
  console.log('[loadModel] SUCCESS — mannequin in scene, bounds:', modelBounds.min, modelBounds.max);

  // ─── RUN UV GUARD after model finalization ─────────────────────────
  validateR15UVMapping();

  window.flutter_inappwebview?.callHandler('onModelLoaded', true);
}

// ─── CLASSIC CLOTHING MANNEQUIN (Roblox UV-Mapped) ───────────────────
// Box mannequin with per-face UV matching the Roblox R15 classic clothing
// template (585×559). Each face samples the CORRECT region of the template.
// Same UV-mapped preview approach used by Roblox Studio for classic clothing.

function buildClassicClothingMannequin() {
  const root = new THREE.Group();
  root.name = 'HumanoidRootPart';

  // Template pixel dimensions
  const TW = 585, TH = 559;

  // Helper: convert pixel rect (x, y, w, h) to normalized UV [u0, v0, u1, v1]
  // With flipY=false: UV(0,0) = image top-left, UV(1,1) = image bottom-right
  function px(x, y, w, h) {
    return [x / TW, y / TH, (x + w) / TW, (y + h) / TH];
  }

  // Override BoxGeometry UV per face.
  // BoxGeometry face order: 0=+X, 1=-X, 2=+Y, 3=-Y, 4=+Z, 5=-Z
  // Each face has 4 vertices in order:
  //   v0 = default(0,1) = face top-left when looking from outside
  //   v1 = default(1,1) = face top-right
  //   v2 = default(0,0) = face bottom-left
  //   v3 = default(1,0) = face bottom-right
  // With flipY=false, v_small = image top, v_large = image bottom.
  function setBoxUV(geo, faceUVs) {
    const uvArr = geo.attributes.uv.array;
    for (let f = 0; f < 6; f++) {
      const [u0, v0, u1, v1] = faceUVs[f]; // [left, top, right, bottom] in image coords
      const i = f * 8; // 4 verts × 2 components
      uvArr[i + 0] = u0; uvArr[i + 1] = v0; // top-left
      uvArr[i + 2] = u1; uvArr[i + 3] = v0; // top-right
      uvArr[i + 4] = u0; uvArr[i + 5] = v1; // bottom-left
      uvArr[i + 6] = u1; uvArr[i + 7] = v1; // bottom-right
    }
    geo.attributes.uv.needsUpdate = true;
  }

  function makeClothingPart(name, w, h, d, x, y, z, faceUVs) {
    const geo = new THREE.BoxGeometry(w, h, d);
    if (faceUVs) setBoxUV(geo, faceUVs);
    const edgesGeo = new THREE.EdgesGeometry(geo);
    const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      color: 0xFFFFFF, roughness: 0.6, metalness: 0.05,
    }));
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    const edges = new THREE.LineSegments(edgesGeo, new THREE.LineBasicMaterial({
      color: 0x555555, linewidth: 1
    }));
    const group = new THREE.Group();
    group.name = name;
    group.add(mesh);
    group.add(edges);
    group.position.set(x, y, z);
    return group;
  }

  function makeSkinPart(name, w, h, d, x, y, z) {
    const geo = new THREE.BoxGeometry(w, h, d);
    const edgesGeo = new THREE.EdgesGeometry(geo);
    const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      color: SKIN_COLOR, roughness: 0.7, metalness: 0.05,
    }));
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    const edges = new THREE.LineSegments(edgesGeo, new THREE.LineBasicMaterial({
      color: 0x555555, linewidth: 1
    }));
    const group = new THREE.Group();
    group.name = name;
    group.add(mesh);
    group.add(edges);
    group.position.set(x, y, z);
    return group;
  }

  // ════════════════════════════════════════════════════════════════════
  // TORSO UV REGIONS (top strip of template: y=0..219)
  // Template layout: [Right|Front|Left|Back] from x=0 to x=585
  // ════════════════════════════════════════════════════════════════════
  //   Right side: px(0,   0, 105, 219)
  //   Front:      px(105, 0, 220, 219)
  //   Left side:  px(325, 0, 105, 219)
  //   Back:       px(430, 0, 155, 219)

  // Full torso UV (UpperTorso gets top ~80%, LowerTorso gets bottom ~20%)
  var torsoSplit = 175; // UpperTorso = 0..175px, LowerTorso = 175..219px

  // UpperTorso face UVs [+X, -X, +Y, -Y, +Z, -Z]
  var upperTorsoUV = [
    px(0,   0, 105, torsoSplit),   // +X = character right side
    px(325, 0, 105, torsoSplit),   // -X = character left side
    px(105, 0, 220, 10),           // +Y = top (thin strip from front, rarely visible)
    px(105, torsoSplit - 10, 220, 10), // -Y = bottom seam
    px(105, 0, 220, torsoSplit),   // +Z = front
    px(430, 0, 155, torsoSplit),   // -Z = back
  ];

  // LowerTorso face UVs
  var lowerTorsoUV = [
    px(0,   torsoSplit, 105, 219 - torsoSplit), // +X = right
    px(325, torsoSplit, 105, 219 - torsoSplit), // -X = left
    px(105, torsoSplit, 220, 5),                // +Y = top seam
    px(105, 214, 220, 5),                       // -Y = bottom seam
    px(105, torsoSplit, 220, 219 - torsoSplit), // +Z = front
    px(430, torsoSplit, 155, 219 - torsoSplit), // -Z = back
  ];

  // ════════════════════════════════════════════════════════════════════
  // ARM UV REGIONS (bottom half of template: y=219..559)
  // Two cross-shapes: Right arm (left cross), Left arm (right cross)
  //
  // Standard Roblox arm cross layout (4 face columns):
  //          [Top cap]
  //  [Outer][Front][Inner][Back]
  //          [Bot cap]
  //
  // Right arm cross: approximately x=0..244, y=219..559
  //   4 columns of ~56px each for side faces  (56*4=224, +caps)
  //   Top cap:    y=219..255,  x=56..112
  //   Sides:      y=255..524
  //   Bottom cap: y=524..559
  //
  // Left arm cross: approximately x=244..488, y=219..559
  //   Same structure, mirrored
  // ════════════════════════════════════════════════════════════════════

  var armFaceW  = 56;   // width of each arm face column
  var armCapH   = 36;   // height of top/bottom cap
  var armSideY  = 219 + armCapH;  // 255
  var armSideH  = 559 - armSideY - armCapH; // 559-255-36 = 268

  // RIGHT ARM (cross starts at x=0)
  var raX = 0;
  var rightUpperArmUV = [
    px(raX + armFaceW * 2, armSideY, armFaceW, armSideH / 2), // +X = inner (towards body)
    px(raX,                armSideY, armFaceW, armSideH / 2), // -X = outer (away from body)
    px(raX + armFaceW, 219, armFaceW, armCapH),                // +Y = top cap
    px(raX + armFaceW, armSideY + armSideH / 2 - 5, armFaceW, 10), // -Y = seam
    px(raX + armFaceW,     armSideY, armFaceW, armSideH / 2), // +Z = front
    px(raX + armFaceW * 3, armSideY, armFaceW, armSideH / 2), // -Z = back
  ];
  var rightLowerArmUV = [
    px(raX + armFaceW * 2, armSideY + armSideH / 2, armFaceW, armSideH / 2), // +X = inner
    px(raX,                armSideY + armSideH / 2, armFaceW, armSideH / 2), // -X = outer
    px(raX + armFaceW, armSideY + armSideH / 2 - 5, armFaceW, 10),           // +Y = seam
    px(raX + armFaceW, 559 - armCapH, armFaceW, armCapH),                     // -Y = bottom cap
    px(raX + armFaceW,     armSideY + armSideH / 2, armFaceW, armSideH / 2), // +Z = front
    px(raX + armFaceW * 3, armSideY + armSideH / 2, armFaceW, armSideH / 2), // -Z = back
  ];

  // LEFT ARM (cross starts at x=244)
  var laX = 244;
  var leftUpperArmUV = [
    px(laX,                armSideY, armFaceW, armSideH / 2), // +X = outer (away from body for left arm)
    px(laX + armFaceW * 2, armSideY, armFaceW, armSideH / 2), // -X = inner
    px(laX + armFaceW, 219, armFaceW, armCapH),                // +Y = top cap
    px(laX + armFaceW, armSideY + armSideH / 2 - 5, armFaceW, 10), // -Y = seam
    px(laX + armFaceW,     armSideY, armFaceW, armSideH / 2), // +Z = front
    px(laX + armFaceW * 3, armSideY, armFaceW, armSideH / 2), // -Z = back
  ];
  var leftLowerArmUV = [
    px(laX,                armSideY + armSideH / 2, armFaceW, armSideH / 2), // +X = outer
    px(laX + armFaceW * 2, armSideY + armSideH / 2, armFaceW, armSideH / 2), // -X = inner
    px(laX + armFaceW, armSideY + armSideH / 2 - 5, armFaceW, 10),           // +Y = seam
    px(laX + armFaceW, 559 - armCapH, armFaceW, armCapH),                     // -Y = bottom cap
    px(laX + armFaceW,     armSideY + armSideH / 2, armFaceW, armSideH / 2), // +Z = front
    px(laX + armFaceW * 3, armSideY + armSideH / 2, armFaceW, armSideH / 2), // -Z = back
  ];

  // ════════════════════════════════════════════════════════════════════
  // LEG UV REGIONS
  // Legs use the SAME template positions as arms (y=219..559).
  // In the composite texture:
  //   - Shirt PNG has arms here (legs area transparent)
  //   - Pants PNG has legs here (arms area transparent)
  // Since both arms/legs share same UV regions, the composite works:
  //   legs show through transparent arm areas and vice versa.
  //
  // We use the same UV coordinates — the composite texture ensures
  // the correct content appears for each body part.
  // ════════════════════════════════════════════════════════════════════

  var rightUpperLegUV = rightUpperArmUV;
  var rightLowerLegUV = rightLowerArmUV;
  var leftUpperLegUV  = leftUpperArmUV;
  var leftLowerLegUV  = leftLowerArmUV;

  // ════════════════════════════════════════════════════════════════════
  // BUILD THE MANNEQUIN
  // Proportions match the existing procedural mannequin for visual parity
  // ════════════════════════════════════════════════════════════════════

  // Head (skin — no clothing UV)
  var Head = makeSkinPart('Head', 1.3, 1.3, 1.3, 0, 4.85, 0);

  var Neck = new THREE.Group();
  Neck.name = 'Neck';
  Neck.position.set(0, 4.1, 0);

  // Torso (clothing)
  var UpperTorso = makeClothingPart('UpperTorso', 2.0, 1.6, 2.0, 0, 3.2, 0, upperTorsoUV);
  var LowerTorso = makeClothingPart('LowerTorso', 2.0, 0.4, 2.0, 0, 2.25, 0, lowerTorsoUV);

  // Arms (clothing)
  var RightUpperArm = makeClothingPart('RightUpperArm', 0.9, 1.3, 0.9, 1.25, 3.35, 0, rightUpperArmUV);
  var RightLowerArm = makeClothingPart('RightLowerArm', 0.9, 1.3, 0.9, 1.25, 2.05, 0, rightLowerArmUV);
  var LeftUpperArm  = makeClothingPart('LeftUpperArm',  0.9, 1.3, 0.9, -1.25, 3.35, 0, leftUpperArmUV);
  var LeftLowerArm  = makeClothingPart('LeftLowerArm',  0.9, 1.3, 0.9, -1.25, 2.05, 0, leftLowerArmUV);

  // Legs (clothing)
  var RightUpperLeg = makeClothingPart('RightUpperLeg', 0.95, 1.3, 1.2, 0.5, 0.7, 0, rightUpperLegUV);
  var RightLowerLeg = makeClothingPart('RightLowerLeg', 0.95, 1.3, 1.2, 0.5, -0.6, 0, rightLowerLegUV);
  var LeftUpperLeg  = makeClothingPart('LeftUpperLeg',  0.95, 1.3, 1.2, -0.5, 0.7, 0, leftUpperLegUV);
  var LeftLowerLeg  = makeClothingPart('LeftLowerLeg',  0.95, 1.3, 1.2, -0.5, -0.6, 0, leftLowerLegUV);

  // Hands/Feet (skin)
  var RightHand = makeSkinPart('RightHand', 0.5, 0.2, 0.5, 1.25, 1.3, 0);
  var LeftHand  = makeSkinPart('LeftHand',  0.5, 0.2, 0.5, -1.25, 1.3, 0);
  var RightFoot = makeSkinPart('RightFoot', 0.95, 0.3, 1.4, 0.5, -1.1, 0.1);
  var LeftFoot  = makeSkinPart('LeftFoot',  0.95, 0.3, 1.4, -0.5, -1.1, 0.1);

  // Face details
  var eyeMat = new THREE.MeshBasicMaterial({ color: 0x222222 });
  var eyeGeo = new THREE.BoxGeometry(0.15, 0.15, 0.05);
  var leftEye = new THREE.Mesh(eyeGeo, eyeMat);
  leftEye.position.set(-0.25, 5.0, 0.63);
  var rightEye = new THREE.Mesh(eyeGeo, eyeMat);
  rightEye.position.set(0.25, 5.0, 0.63);
  var smileMat = new THREE.MeshBasicMaterial({ color: 0x333333 });
  var smileGeo = new THREE.BoxGeometry(0.5, 0.08, 0.05);
  var smile = new THREE.Mesh(smileGeo, smileMat);
  smile.position.set(0, 4.7, 0.63);

  // Attachment nodes (same as procedural mannequin)
  var makeAttach = function(name, parent, lx, ly, lz) {
    var a = new THREE.Object3D();
    a.name = name;
    a.position.set(lx, ly, lz);
    parent.add(a);
    return a;
  };
  makeAttach('HatAttachment', Head, 0, 0.65, 0);
  makeAttach('HairAttachment', Head, 0, 0.65, -0.15);
  makeAttach('FaceFrontAttachment', Head, 0, 0, 0.65);
  makeAttach('FaceCenterAttachment', Head, 0, 0, 0);
  makeAttach('NeckAttachment', Neck, 0, 0, 0);
  makeAttach('BodyFrontAttachment', UpperTorso, 0, 0, 1.0);
  makeAttach('BodyBackAttachment', UpperTorso, 0, 0, -1.0);
  makeAttach('WaistCenterAttachment', LowerTorso, 0, 0, 0);
  makeAttach('WaistFrontAttachment', LowerTorso, 0, 0, 1.0);
  makeAttach('WaistBackAttachment', LowerTorso, 0, 0, -1.0);
  makeAttach('RightCollarAttachment', RightUpperArm, 0, 0.65, 0);
  makeAttach('LeftCollarAttachment', LeftUpperArm, 0, 0.65, 0);

  // Assemble
  root.add(Head, Neck, UpperTorso, LowerTorso);
  root.add(LeftUpperArm, LeftLowerArm, RightUpperArm, RightLowerArm);
  root.add(LeftUpperLeg, LeftLowerLeg, LeftFoot);
  root.add(RightUpperLeg, RightLowerLeg, RightFoot);
  root.add(LeftHand, RightHand);
  root.add(leftEye, rightEye, smile);

  root.position.y = 1.3;
  root.rotation.y = 0.25;

  return root;
}

// Build and place classic clothing mannequin
window.loadClassicMannequin = function() {
  console.log('[loadModel] Building classic clothing mannequin with Roblox UV mapping...');
  _mannequinSource = 'classic_uv';
  if (currentModel) {
    scene.remove(currentModel);
    currentModel = null;
  }
  currentModel = buildClassicClothingMannequin();
  finalizeModel();
};

// ─── PROCEDURAL ROBLOX R15 MANNEQUIN ─────────────────────────────────
// Creates a proper 3D blocky character with named nodes for attachment.
// No external GLB needed. Each body part is a real 3D box mesh.

function buildProceduralMannequin() {
  const root = new THREE.Group();
  root.name = 'HumanoidRootPart';

  const skinColor = 0xa3a3a3;  // Neutral gray
  const outlineColor = 0x6b6b6b; // Darker edges
  const mat = new THREE.MeshStandardMaterial({
    color: skinColor,
    roughness: 0.7,
    metalness: 0.05,
  });
  const darkMat = new THREE.MeshStandardMaterial({
    color: outlineColor,
    roughness: 0.8,
    metalness: 0.05,
  });

  function makePart(name, w, h, d, x, y, z, material) {
    const geo = new THREE.BoxGeometry(w, h, d);
    const edgesGeo = new THREE.EdgesGeometry(geo);
    const mesh = new THREE.Mesh(geo, material || mat);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    const edges = new THREE.LineSegments(edgesGeo, new THREE.LineBasicMaterial({ color: 0x555555, linewidth: 1 }));
    const group = new THREE.Group();
    group.name = name;
    group.add(mesh);
    group.add(edges);
    group.position.set(x, y, z);
    return group;
  }

  // ── Body: SQUARE torso from top view = clearly 3D from ALL angles ──

  // Head (1.3 cube)
  const Head = makePart('Head', 1.3, 1.3, 1.3, 0, 4.85, 0);
  
  const Neck = new THREE.Group();
  Neck.name = 'Neck';
  Neck.position.set(0, 4.1, 0);
  
  // Torso: 2.0 wide × 2.0 DEEP = square from top → same width from front AND side
  const UpperTorso = makePart('UpperTorso', 2.0, 1.6, 2.0, 0, 3.2, 0);
  const LowerTorso = makePart('LowerTorso', 2.0, 0.4, 2.0, 0, 2.25, 0);

  // Arms: closer to body (x=±1.25), square cross-section 0.9×0.9
  const LeftUpperArm = makePart('LeftUpperArm', 0.9, 1.3, 0.9, -1.25, 3.35, 0);
  const LeftLowerArm = makePart('LeftLowerArm', 0.9, 1.3, 0.9, -1.25, 2.05, 0);
  const RightUpperArm = makePart('RightUpperArm', 0.9, 1.3, 0.9, 1.25, 3.35, 0);
  const RightLowerArm = makePart('RightLowerArm', 0.9, 1.3, 0.9, 1.25, 2.05, 0);

  // Legs: 1.0 wide × 1.2 deep
  const LeftUpperLeg = makePart('LeftUpperLeg', 0.95, 1.3, 1.2, -0.5, 0.7, 0, darkMat);
  const LeftLowerLeg = makePart('LeftLowerLeg', 0.95, 1.3, 1.2, -0.5, -0.6, 0, darkMat);
  const LeftFoot = makePart('LeftFoot', 0.95, 0.3, 1.4, -0.5, -1.1, 0.1, darkMat);
  const RightUpperLeg = makePart('RightUpperLeg', 0.95, 1.3, 1.2, 0.5, 0.7, 0, darkMat);
  const RightLowerLeg = makePart('RightLowerLeg', 0.95, 1.3, 1.2, 0.5, -0.6, 0, darkMat);
  const RightFoot = makePart('RightFoot', 0.95, 0.3, 1.4, 0.5, -1.1, 0.1, darkMat);

  // Face
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0x222222 });
  const eyeGeo = new THREE.BoxGeometry(0.15, 0.15, 0.05);
  const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
  leftEye.position.set(-0.25, 5.0, 0.63);
  const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
  rightEye.position.set(0.25, 5.0, 0.63);
  const smileMat = new THREE.MeshBasicMaterial({ color: 0x333333 });
  const smileGeo = new THREE.BoxGeometry(0.5, 0.08, 0.05);
  const smile = new THREE.Mesh(smileGeo, smileMat);
  smile.position.set(0, 4.7, 0.63);

  // ── Roblox Attachment Nodes (empty Object3D for auto-snap) ──
  const makeAttach = (name, parent, lx, ly, lz) => {
    const a = new THREE.Object3D();
    a.name = name;
    a.position.set(lx, ly, lz);
    parent.add(a);
    return a;
  };
  // Head attachments — Head is at (0, 4.85, 0), size 1.3³
  makeAttach('HatAttachment', Head, 0, 0.65, 0);        // top of head
  makeAttach('HairAttachment', Head, 0, 0.65, -0.15);   // slightly back
  makeAttach('FaceFrontAttachment', Head, 0, 0, 0.65);  // face front
  makeAttach('FaceCenterAttachment', Head, 0, 0, 0);     // face center
  // Neck
  makeAttach('NeckAttachment', Neck, 0, 0, 0);
  // Torso attachments
  makeAttach('BodyFrontAttachment', UpperTorso, 0, 0, 1.0);
  makeAttach('BodyBackAttachment', UpperTorso, 0, 0, -1.0);
  // Waist
  makeAttach('WaistCenterAttachment', LowerTorso, 0, 0, 0);
  makeAttach('WaistFrontAttachment', LowerTorso, 0, 0, 1.0);
  makeAttach('WaistBackAttachment', LowerTorso, 0, 0, -1.0);
  // Shoulders
  makeAttach('RightCollarAttachment', RightUpperArm, 0, 0.65, 0);
  makeAttach('LeftCollarAttachment', LeftUpperArm, 0, 0.65, 0);

  // ── Assemble ──
  root.add(Head, Neck, UpperTorso, LowerTorso);
  root.add(LeftUpperArm, LeftLowerArm, RightUpperArm, RightLowerArm);
  root.add(LeftUpperLeg, LeftLowerLeg, LeftFoot);
  root.add(RightUpperLeg, RightLowerLeg, RightFoot);
  root.add(leftEye, rightEye, smile);

  // Shift root so feet are at Y=0
  root.position.y = 1.3;

  // Slight rotation so 3D depth is immediately visible
  root.rotation.y = 0.25;

  return root;
}

// REMOVED: Duplicate window.updateTexture definition that was overwriting the
// canonical version above. This caused non-deterministic behavior.
