<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Studio Editor - Text Properties</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-secondary-fixed": "#403f3f",
              "surface-bright": "#f7f7f4",
              "error-dim": "#9f0519",
              "on-primary-fixed": "#000000",
              "on-surface-variant": "#5a5c5a",
              "secondary-fixed": "#e5e2e1",
              "secondary-dim": "#504f4f",
              "on-secondary": "#f5f2f1",
              "on-error-container": "#570008",
              "primary-dim": "#8c3300",
              "primary-fixed-dim": "#f86513",
              "error": "#b31b25",
              "on-primary-container": "#421400",
              "surface-container-low": "#f0f1ee",
              "surface-variant": "#dcddda",
              "secondary": "#5c5b5b",
              "on-background": "#2d2f2d",
              "on-primary": "#ffefea",
              "on-error": "#ffefee",
              "on-secondary-fixed-variant": "#5c5b5b",

              "on-tertiary-fixed-variant": "#126f44",
              "tertiary-fixed-dim": "#9aefb9",
              "on-surface": "#2d2f2d",
              "primary": "#9f3b00",
              "surface-container-lowest": "#ffffff",
              "tertiary-container": "#a8fec6",
              "inverse-surface": "#0d0f0d",
              "on-tertiary-container": "#00643b",
              "outline": "#767775",
              "inverse-primary": "#ff6a1a",
              "surface-container": "#e8e8e5",
              "surface-dim": "#d3d5d1",
              "inverse-on-surface": "#9c9d9b",
              "surface-container-highest": "#dcddda",
              "tertiary-fixed": "#a8fec6",
              "background": "#f7f7f4",
              "tertiary-dim": "#005c36",
              "surface": "#f7f7f4",
              "primary-container": "#ff793a",
              "error-container": "#fb5151",
              "primary-fixed": "#ff793a",
              "tertiary": "#06693f",
              "secondary-fixed-dim": "#d7d4d3",
              "on-tertiary": "#cbffda",
              "surface-container-high": "#e2e3df"
            },
            fontFamily: {
              "headline": ["Plus Jakarta Sans"],
              "body": ["Manrope"],
              "label": ["Manrope"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      .glass-sheet {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(24px);
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#F6F6F3] text-[#2D2F2D] font-body flex justify-center items-start min-h-screen">
<!-- iPhone 15 Pro Wrapper (Mobile Viewport) -->
<main class="w-full max-w-[393px] min-h-[852px] bg-background relative overflow-hidden flex flex-col">
<!-- Top Navigation -->
<header class="bg-[#F7F7F4]/85 dark:bg-stone-900/85 backdrop-blur-xl docked full-width top-0 z-50 flex justify-between items-center px-6 py-4 w-full">
<button class="hover:opacity-80 transition-opacity press:scale-95 duration-200">
<span class="material-symbols-outlined text-on-surface">close</span>
</button>
<h1 class="font-headline font-bold tracking-tight text-xl text-[#2D2F2D] dark:text-stone-100">Editor</h1>
<button class="bg-primary-container text-on-primary-container px-4 py-1.5 rounded-full font-label font-bold text-xs uppercase tracking-widest hover:opacity-80 transition-opacity press:scale-95 duration-200">
                Done
            </button>
</header>
<!-- Top Half: 3D Preview Canvas -->
<section class="relative w-full h-[340px] flex items-center justify-center overflow-hidden bg-surface-container-low">
<!-- Background Visual -->
<img class="absolute inset-0 w-full h-full object-cover opacity-20 grayscale" data-alt="abstract minimalist 3D rendering with soft flowing shapes and warm studio lighting on a neutral background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDaohR2W2CuC6Rw8lYE56RIb1Uu4a3vWUcvwLSadTk_4KGnjHwH71HC3zrvutSpCFUehiJXRN9kmq7dVPay7jaUZE0zDa9pjmSVoinKFWzl-DUzgP2R4Ik9vpv3w3EjMemiX8EjGfrN_JgT-ZZP2TyorYvaeB9b5Q_yPFTyi1WulkJgqAAMaglEs-TUPmK9wpeukqnTKgcjhZOjYLxK8NztdNi-ZEd_8l7SQtSPx82sOUMA5-MywdGkeYJ0Ujr6-izXr2Uhe1QpGWgf"/>
<!-- Floating Text Layer (Selected) -->
<div class="relative z-10 p-6 border-2 border-primary-fixed rounded-xl flex items-center justify-center transform perspective-1000 rotate-x-12 rotate-y-[-10deg]">
<span class="font-headline font-extrabold text-5xl text-[#2D2F2D] tracking-tight text-center drop-shadow-xl">
                    THE STUDIO
                </span>
<!-- Selection Handles -->
<div class="absolute -top-2 -left-2 w-4 h-4 bg-primary-fixed rounded-full border-2 border-white"></div>
<div class="absolute -top-2 -right-2 w-4 h-4 bg-primary-fixed rounded-full border-2 border-white"></div>
<div class="absolute -bottom-2 -left-2 w-4 h-4 bg-primary-fixed rounded-full border-2 border-white"></div>
<div class="absolute -bottom-2 -right-2 w-4 h-4 bg-primary-fixed rounded-full border-2 border-white"></div>
<div class="absolute -top-8 left-1/2 -translate-x-1/2 bg-primary-fixed text-white px-2 py-0.5 rounded text-[10px] font-bold">Text Layer</div>
</div>
<!-- Quick Context Actions -->
<div class="absolute bottom-4 right-4 flex gap-2">
<button class="w-10 h-10 bg-surface-container-lowest rounded-full shadow-sm flex items-center justify-center text-on-surface hover:opacity-80 press:scale-95 duration-200">
<span class="material-symbols-outlined text-[20px]">layers</span>
</button>
<button class="w-10 h-10 bg-surface-container-lowest rounded-full shadow-sm flex items-center justify-center text-on-surface hover:opacity-80 press:scale-95 duration-200">
<span class="material-symbols-outlined text-[20px]">view_in_ar</span>
</button>
</div>
</section>
<!-- Bottom Half: Properties Sheet -->
<section class="flex-1 bg-surface-container-lowest rounded-t-[2.5rem] shadow-[0_-12px_24px_rgba(159,59,0,0.04)] overflow-y-auto no-scrollbar pb-12">
<!-- Drag Handle -->
<div class="w-12 h-1 bg-surface-variant rounded-full mx-auto mt-3 mb-6"></div>
<div class="px-6 space-y-8">
<!-- Text Input Section -->
<div class="space-y-3">
<label class="font-label text-xs font-extrabold uppercase tracking-widest text-on-surface-variant px-1">Text Content</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-none rounded-2xl px-5 py-4 font-body text-md focus:ring-2 focus:ring-primary-fixed/20 focus:bg-white transition-all text-[#111111]" type="text" value="THE STUDIO"/>
</div>
</div>
<!-- Font & Alignment Cluster -->
<div class="grid grid-cols-2 gap-4">
<div class="space-y-3">
<label class="font-label text-xs font-extrabold uppercase tracking-widest text-on-surface-variant px-1">Font Family</label>
<button class="w-full bg-surface-container-low px-4 py-3 rounded-2xl flex items-center justify-between">
<span class="font-headline font-bold text-sm">Jakarta Sans</span>
<span class="material-symbols-outlined text-sm">unfold_more</span>
</button>
</div>
<div class="space-y-3">
<label class="font-label text-xs font-extrabold uppercase tracking-widest text-on-surface-variant px-1">Alignment</label>
<div class="flex bg-surface-container-low p-1 rounded-2xl">
<button class="flex-1 py-2 bg-white rounded-xl shadow-sm flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]">format_align_center</span>
</button>
<button class="flex-1 py-2 flex items-center justify-center text-on-surface-variant opacity-60">
<span class="material-symbols-outlined text-[20px]">format_align_left</span>
</button>
<button class="flex-1 py-2 flex items-center justify-center text-on-surface-variant opacity-60">
<span class="material-symbols-outlined text-[20px]">format_align_right</span>
</button>
</div>
</div>
</div>
<!-- Style Controls -->
<div class="space-y-3">
<label class="font-label text-xs font-extrabold uppercase tracking-widest text-on-surface-variant px-1">Style Options</label>
<div class="flex gap-2">
<button class="flex-1 h-12 bg-surface-container-low rounded-2xl flex items-center justify-center font-bold text-sm hover:bg-white hover:shadow-sm border border-transparent hover:border-outline-variant/10">
<span class="material-symbols-outlined mr-2">format_bold</span> B
                        </button>
<button class="flex-1 h-12 bg-surface-container-low rounded-2xl flex items-center justify-center font-bold text-sm opacity-50">
<span class="material-symbols-outlined mr-2">format_italic</span> I
                        </button>
<button class="flex-1 h-12 bg-surface-container-low rounded-2xl flex items-center justify-center font-bold text-sm opacity-50">
<span class="material-symbols-outlined mr-2">format_underlined</span> U
                        </button>
</div>
</div>
<!-- Color Swatches -->
<div class="space-y-3">
<div class="flex justify-between items-end px-1">
<label class="font-label text-xs font-extrabold uppercase tracking-widest text-on-surface-variant">Text Color</label>
<span class="text-[10px] font-bold text-primary-fixed">#2D2F2D</span>
</div>
<div class="flex gap-3 overflow-x-auto no-scrollbar py-1">
<div class="w-10 h-10 rounded-full bg-[#2D2F2D] ring-2 ring-offset-2 ring-primary-fixed shrink-0"></div>
<div class="w-10 h-10 rounded-full bg-white border border-outline-variant/20 shrink-0"></div>
<div class="w-10 h-10 rounded-full bg-[#FF793A] shrink-0"></div>
<div class="w-10 h-10 rounded-full bg-[#9F3B00] shrink-0"></div>
<div class="w-10 h-10 rounded-full bg-[#06693F] shrink-0"></div>
<div class="w-10 h-10 rounded-full bg-[#B31B25] shrink-0"></div>
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-sm">colorize</span>
</div>
</div>
</div>
<!-- Outline Settings -->
<div class="space-y-4">
<div class="flex justify-between items-center px-1">
<label class="font-label text-xs font-extrabold uppercase tracking-widest text-on-surface-variant">Text Outline</label>
<!-- Switch -->
<div class="w-10 h-6 bg-surface-container-high rounded-full relative p-1">
<div class="w-4 h-4 bg-white rounded-full shadow-sm"></div>
</div>
</div>
<div class="p-4 bg-surface-container-low/50 rounded-2xl flex items-center gap-4 opacity-50">
<div class="w-8 h-8 rounded-full bg-white border border-outline-variant/20"></div>
<div class="flex-1 h-1.5 bg-surface-container-high rounded-full overflow-hidden">
<div class="w-1/3 h-full bg-outline-variant"></div>
</div>
<span class="font-label text-[10px] font-bold text-on-surface-variant">2.0pt</span>
</div>
</div>
<!-- Layer Management -->
<div class="pt-4 border-t border-surface-variant/20 space-y-4">
<div class="flex gap-3">
<button class="flex-1 bg-surface-container-low py-4 rounded-2xl flex flex-col items-center justify-center gap-1 hover:bg-white hover:shadow-sm transition-all press:scale-95">
<span class="material-symbols-outlined text-[20px] text-on-surface">content_copy</span>
<span class="font-label text-[10px] font-bold uppercase tracking-tight">Duplicate</span>
</button>
<button class="flex-1 bg-surface-container-low py-4 rounded-2xl flex flex-col items-center justify-center gap-1 hover:bg-white hover:shadow-sm transition-all press:scale-95">
<span class="material-symbols-outlined text-[20px] text-on-surface">layers_clear</span>
<span class="font-label text-[10px] font-bold uppercase tracking-tight text-error">Delete</span>
</button>
</div>
<div class="flex gap-3">
<button class="flex-1 h-14 border-2 border-surface-container-low rounded-2xl flex items-center justify-center gap-2 hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-[20px]">move_up</span>
<span class="font-label text-xs font-bold">Forward</span>
</button>
<button class="flex-1 h-14 border-2 border-surface-container-low rounded-2xl flex items-center justify-center gap-2 hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-[20px]">move_down</span>
<span class="font-label text-xs font-bold">Backward</span>
</button>
</div>
</div>
</div>
</section>
<!-- Bottom Tab Bar (Suppressed FAB on Editor screen per instructions) -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pb-6 pt-3 bg-[#F7F7F4]/85 dark:bg-stone-900/85 backdrop-blur-xl rounded-t-[2.5rem] shadow-[0_-12px_24px_rgba(159,59,0,0.04)] z-50">
<a class="flex flex-col items-center justify-center text-[#2D2F2D]/50 dark:text-stone-400" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-['Manrope'] text-[10px] font-bold uppercase tracking-widest mt-1">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-[#9F3B00] dark:text-[#FF793A] bg-[#FF793A]/10 rounded-full px-4 py-1" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="font-['Manrope'] text-[10px] font-bold uppercase tracking-widest mt-1">Create</span>
</a>
<a class="flex flex-col items-center justify-center text-[#2D2F2D]/50 dark:text-stone-400" href="#">
<span class="material-symbols-outlined">inventory_2</span>
<span class="font-['Manrope'] text-[10px] font-bold uppercase tracking-widest mt-1">Library</span>
</a>
<a class="flex flex-col items-center justify-center text-[#2D2F2D]/50 dark:text-stone-400" href="#">
<span class="material-symbols-outlined">shopping_bag</span>
<span class="font-['Manrope'] text-[10px] font-bold uppercase tracking-widest mt-1">Store</span>
</a>
<a class="flex flex-col items-center justify-center text-[#2D2F2D]/50 dark:text-stone-400" href="#">
<span class="material-symbols-outlined">explore</span>
<span class="font-['Manrope'] text-[10px] font-bold uppercase tracking-widest mt-1">Explore</span>
</a>
</nav>
</main>
</body></html>
