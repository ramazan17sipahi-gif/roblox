<main class="relative w-[393px] h-[852px] bg-background overflow-hidden flex flex-col items-center">

</div>
</div>

<div class="absolute bottom-40 right-4 w-32 h-32 bg-tertiary/5 rounded-full blur-3xl"></div>

<div class="w-full h-full bg-surface-container-low rounded-[2.2rem] overflow-hidden relative group">

<div class="h-1 w-full bg-on-background/10 rounded-full overflow-hidden">
<div class="h-full w-2/3 bg-primary-container rounded-full"></div>
</div>
<div class="flex justify-between items-center px-1">

</div>
</div>
<div class="absolute top-6 left-1/2 -translate-x-1/2 w-16 h-1.5 bg-on-background/10 rounded-full"></div>
</div>

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">deployed_code</span>
</div>
<div class="absolute -left-10 bottom-1/4 w-14 h-14 bg-surface-container-lowest rounded-2xl shadow-xl flex items-center justify-center text-tertiary transform -rotate-12 transition-transform duration-300 hover:scale-110">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>

<p class="text-on-surface-variant font-body text-[15px] leading-relaxed">

<div class="w-32 h-1.5 bg-on-background/10 rounded-full mt-2"></div>
</section>
