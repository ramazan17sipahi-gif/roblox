name: mobile_app
description: "RBLX Clothing Maker: Shirts & Pants"
publish_to: 'none'
version: 1.0.1+5

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  
  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  
  # External Services
  supabase_flutter: ^2.4.0
  
  cached_network_image: ^3.4.1
  
  # Internal Packages
  design_system:
    path: ../../packages/design_system
  models:
    path: ../../packages/models
  networking:
    path: ../../packages/networking
  billing:
    path: ../../packages/billing
  in_app_purchase: ^3.2.0
  flutter_3d_controller: ^2.3.0
  flutter_inappwebview: ^6.1.5
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  flutter_web_auth_2: ^4.1.0
  path_provider: ^2.1.5
  file_picker: ^8.1.7
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_logo.png
  adaptive_icon_background: "#FF6A1A"
  adaptive_icon_foreground: assets/branding/app_logo.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/branding/app_logo.png
    background_color: "#FF6A1A"
    theme_color: "#FF6A1A"
  windows:
    generate: true
    image_path: assets/branding/app_logo.png
  macos:
    generate: true
    image_path: assets/branding/app_logo.png

flutter_native_splash:
  color: "#F6F6F3"
  image: assets/branding/app_logo.png
  android_12:
    color: "#F6F6F3"
    image: assets/branding/app_logo.png

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/branding/
    - assets/onboarding/
    - assets/templates/king-set/
    - assets/templates/maroon-set/
    - assets/stickers/flames/
    - assets/stickers/weapons/
    - assets/stickers/badges/
    - assets/stickers/wings/
    - assets/stickers/skulls/
    - assets/stickers/symbols/
    - assets/stickers/gaming/
    - assets/stickers/nature/
