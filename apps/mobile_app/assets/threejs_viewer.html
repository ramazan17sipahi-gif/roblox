// ─── TRUE PARENT-CHILD ATTACHMENT ─────────────────────────────────────
// Accessories become CHILDREN of the mannequin model (or a specific bone).

const ATTACHMENT_MAP = {
  head: ['HatAttachment', 'HairAttachment'],
  face: ['FaceFrontAttachment', 'FaceCenterAttachment'],
  neck: ['NeckAttachment'],
  back: ['BodyBackAttachment'],
  front: ['BodyFrontAttachment'],
  waist: ['WaistCenterAttachment', 'WaistBackAttachment', 'WaistFrontAttachment'],
  shoulder: ['LeftCollarAttachment', 'RightCollarAttachment', 'LeftShoulderAttachment', 'RightShoulderAttachment']
};

function processLoadedAccessory(gltf, slotId, sourceKeyFromFlutter) {
  const nSlot = slotId.toLowerCase();
  const accGroup = new THREE.Group();
  accGroup.name = 'acc_' + slotId;
  const mesh = gltf.scene;

  if (!currentModel) {
    console.warn('[attachAccessory] No mannequin loaded, cannot attach.');
    return;
  }

  // ==== FAZ-1: Anchor World Transform Çözümlemesi ====
  // KÖK NEDEN 1 ÇÖZÜMÜ: Mesh reparent edilmeden önce target anchor world transform hesaplanmalı.
  // Aksi halde bounding box hesaplamaları self-inclusion (mesh'in kendi devasa boyutunu kapsama) hatasına düşer.
  
  let attachType = 'fallback';
  let targetNode = null;
  let anchorWorldPos = new THREE.Vector3();

  // A) Attachment Önceliği
  const possibleAttachments = ATTACHMENT_MAP[nSlot] || [];
  currentModel.traverse((node) => {
    if (!targetNode && possibleAttachments.includes(node.name)) {
      targetNode = node;
      attachType = 'attachment';
    }
  });

  // B) Bone Önceliği (Attachment yoksa)
  if (!targetNode) {
    targetNode = findAttachNode(nSlot);
    if (targetNode) attachType = 'bone';
  }

  const parentNode = targetNode || currentModel;

  // C) Anchor Position — use BODY PART BOUNDS (real geometry), not bone/attachment world pos!
  //    R15 GLBs have all bones at origin; only mesh vertices carry real positions.
  //    So getWorldPosition() on a bone returns ~(0,0,0), NOT the visual head location.
  const bodyPartName = (window._slotToBodyPart || {})[nSlot] || 'Head';
  const bodyPart = (window._bodyPartBounds || {})[bodyPartName];

  if (bodyPart) {
    // Use actual geometry bounds for positioning
    switch (nSlot) {
      case 'head':
        // Anchor at TOP CENTER of head
        anchorWorldPos.set(bodyPart.center.x, bodyPart.maxY, bodyPart.center.z);
        break;
      case 'face':
        // Anchor at FRONT CENTER of head (max Z)
        anchorWorldPos.set(bodyPart.center.x, bodyPart.center.y, bodyPart.box.max.z + 0.05);
        break;
      case 'neck':
        // Anchor at TOP of UpperTorso
        anchorWorldPos.set(bodyPart.center.x, bodyPart.maxY, bodyPart.center.z);
        break;
      case 'front':
        // Anchor at FRONT of UpperTorso
        anchorWorldPos.set(bodyPart.center.x, bodyPart.center.y, bodyPart.box.max.z + 0.05);
        break;
      case 'back':
        // Anchor at BACK of UpperTorso
        anchorWorldPos.set(bodyPart.center.x, bodyPart.center.y, bodyPart.box.min.z - 0.05);
        break;
      case 'waist':
        // Anchor at CENTER of LowerTorso
        anchorWorldPos.set(bodyPart.center.x, bodyPart.center.y, bodyPart.center.z);
        break;
      case 'shoulder':
        // Anchor at TOP-OUTER of arm
        anchorWorldPos.set(bodyPart.box.max.x + 0.02, bodyPart.maxY, bodyPart.center.z);
        break;
      default:
        anchorWorldPos.copy(bodyPart.center);
    }
    console.log('[anchor] Using body part bounds:', nSlot, '→', bodyPartName,
      'anchor:', anchorWorldPos.x.toFixed(3), anchorWorldPos.y.toFixed(3), anchorWorldPos.z.toFixed(3));
  } else if (attachType === 'attachment') {
    targetNode.getWorldPosition(anchorWorldPos);
  } else if (attachType === 'bone') {
    const boneBox = new THREE.Box3().setFromObject(targetNode);
    if (boneBox.isEmpty()) {
       targetNode.getWorldPosition(anchorWorldPos);
    } else {
       boneBox.getCenter(anchorWorldPos);
    }
  } else {
    const fracOffset = computeSlotOffset(nSlot);
    anchorWorldPos.set(fracOffset.x, fracOffset.y, fracOffset.z);
  }

  // ==== FAZ-2: BODY-PART-AWARE Ölçekleme ve Yerleştirme ====

  // 1. MEASURE ACCESSORY — robust outlier-filtered bbox
  const accBoxRaw = new THREE.Box3().setFromObject(mesh);
  const accSizeRaw = accBoxRaw.getSize(new THREE.Vector3());

  const preScaleRobustBox = new THREE.Box3();
  let accMeshCount = 0;
  mesh.traverse((n) => {
    if (n.isMesh && n.visible) {
      n.geometry.computeBoundingBox();
      if (!n.geometry.boundingBox) return;
      const localBox = n.geometry.boundingBox.clone();
      localBox.applyMatrix4(n.matrixWorld);
      const s = localBox.getSize(new THREE.Vector3());
      if (s.x > 100 || s.y > 100 || (s.x > s.y * 10)) {
        console.warn("[attach] PRE-SCALE Outlier Rejected:", n.name, s);
        return;
      }
      preScaleRobustBox.union(localBox);
      accMeshCount++;
    }
  });
  if (preScaleRobustBox.isEmpty()) preScaleRobustBox.copy(accBoxRaw);
  const accRobustSize = preScaleRobustBox.getSize(new THREE.Vector3());
  const accWorldMaxDim = Math.max(accRobustSize.x, accRobustSize.y, accRobustSize.z) || 1;

  // 2. GET TARGET BODY PART — already resolved in anchor section (bodyPartName, bodyPart)
  const headPart = (window._bodyPartBounds || {})['Head'];
  let headWorldHeight = headPart ? headPart.height : 0.5;

  // 3. SCALE — fit accessory to match body part dimensions
  //    Strategy per slot:
  //    head:     acc width → head width * 1.15 (slightly wider to wrap)
  //    face:     acc width → head width * 0.8 (covers face)
  //    neck:     acc width → head width * 1.0
  //    front:    acc width → torso width * 0.7
  //    back:     acc height → torso height * 0.8
  //    waist:    acc width → lower torso width * 0.8
  //    shoulder: acc width → arm width * 1.5
  let targetDim = 0;     // target world-space size
  let accRefDim = 0;     // which accessory dimension to match (w/h/d)

  if (bodyPart) {
    switch (nSlot) {
      case 'head':
        targetDim = bodyPart.width * 1.15;  // slightly wider than head
        accRefDim = accRobustSize.x;        // match accessory WIDTH to head width
        break;
      case 'face':
        targetDim = bodyPart.width * 0.8;
        accRefDim = accRobustSize.x;
        break;
      case 'neck':
        targetDim = bodyPart.width * 1.0;
        accRefDim = accRobustSize.x;
        break;
      case 'front':
        targetDim = bodyPart.width * 0.7;
        accRefDim = accRobustSize.x;
        break;
      case 'back':
        targetDim = bodyPart.height * 0.8;
        accRefDim = accRobustSize.y;
        break;
      case 'waist':
        targetDim = bodyPart.width * 0.9;
        accRefDim = accRobustSize.x;
        break;
      case 'shoulder':
        targetDim = bodyPart.width * 1.5;
        accRefDim = accRobustSize.x;
        break;
      default:
        targetDim = bodyPart.width;
        accRefDim = accWorldMaxDim;
    }
  } else {
    // No body part found — fallback to model size ratio
    const mSize = modelBounds.getSize(new THREE.Vector3());
    targetDim = mSize.y * ((nSlot === 'head') ? 0.25 : 0.20);
    accRefDim = accWorldMaxDim;
  }

  if (accRefDim < 0.001) accRefDim = accWorldMaxDim;
  const parentWorldScale = currentModel.getWorldScale(new THREE.Vector3());
  const scaleFactor = targetDim / (accRefDim * parentWorldScale.y);
  mesh.scale.multiplyScalar(scaleFactor);
  mesh.updateMatrixWorld(true);

  console.log('[attach] Scale:', { slot: nSlot, bodyPart: bodyPartName,
    bodyPartW: bodyPart?.width?.toFixed(3), bodyPartH: bodyPart?.height?.toFixed(3),
    targetDim: targetDim.toFixed(3), accRefDim: accRefDim.toFixed(3),
    scaleFactor: scaleFactor.toFixed(4) });

  // 4. CENTER — recompute bounds AFTER scaling
  const postScaleRobustBox = new THREE.Box3();
  mesh.traverse((n) => {
    if (n.isMesh && n.visible) {
      n.geometry.computeBoundingBox();
      if (!n.geometry.boundingBox) return;
      const localBox = n.geometry.boundingBox.clone();
      localBox.applyMatrix4(n.matrixWorld);
      const s = localBox.getSize(new THREE.Vector3());
      if (s.x > 100 || s.y > 100 || (s.x > s.y * 10)) return;
      postScaleRobustBox.union(localBox);
    }
  });
  if (postScaleRobustBox.isEmpty()) postScaleRobustBox.copy(new THREE.Box3().setFromObject(mesh));

  const accCenter = postScaleRobustBox.getCenter(new THREE.Vector3());
  const accBoundsSize = postScaleRobustBox.getSize(new THREE.Vector3());

  // 5. PLACEMENT — body-part aware positioning
  let chosenPlacementMode;

  if (nSlot === 'head') {
      // HEAD: anchor is at head's TOP (maxY from body part bounds).
      // Helmet should WRAP the head — center the helmet on the head's center.
      chosenPlacementMode = 'HeadWrap';
      if (headPart) {
        // headTopY = anchorWorldPos.y (set in anchor section)
        // We want: helmet center Y → headPart.center.y
        // accGroup will be placed at anchorWorldPos, so mesh offset must compensate
        const dropY = headPart.center.y - anchorWorldPos.y; // negative (center is below top)
        mesh.position.set(-accCenter.x, -accCenter.y + dropY, -accCenter.z);
        console.log('[attach] HeadWrap:', {dropY: dropY.toFixed(3), headCenterY: headPart.center.y.toFixed(3), anchorY: anchorWorldPos.y.toFixed(3)});
      } else {
        const pivotY = postScaleRobustBox.min.y + accBoundsSize.y * 0.3;
        mesh.position.set(-accCenter.x, -pivotY, -accCenter.z);
      }
  } else if (nSlot === 'face') {
      chosenPlacementMode = 'FrontAlign';
      mesh.position.set(-accCenter.x, -accCenter.y, -(postScaleRobustBox.min.z));
  } else {
      chosenPlacementMode = 'CenterAlign';
      mesh.position.set(-accCenter.x, -accCenter.y, -accCenter.z);
  }

  // 4. REPARENT — attach to currentModel root only (no bone parenting)
  accGroup.add(mesh);
  currentModel.add(accGroup);

  // 5. POSITION — convert world anchor to currentModel local, set once
  let finalLocalOffset = anchorWorldPos.clone();
  currentModel.worldToLocal(finalLocalOffset);
  accGroup.position.copy(finalLocalOffset);

  // (Optional) Anchor Quaternion
  const anchorWorldQuat = new THREE.Quaternion();
  targetNode && targetNode.getWorldQuaternion(anchorWorldQuat);

  // Store with explicit source key tracking
  attachedAccessories[slotId] = {
    group: accGroup,
    mesh: mesh,
    parent: currentModel,
    baseOffset: { x: finalLocalOffset.x, y: finalLocalOffset.y, z: finalLocalOffset.z },
    usedBone: attachType !== 'fallback',
    scaleComputed: scaleFactor,
    maxDim: accWorldMaxDim,
    _sourceKeyFromFlutter: sourceKeyFromFlutter || 'UNKNOWN',
    _jsSlotId: slotId
  };

  const finalWorldPos = new THREE.Vector3();
  accGroup.getWorldPosition(finalWorldPos);

  // METRİK TESPİTİ
  const anchorToFinalDist = anchorWorldPos.distanceTo(finalWorldPos);
  const helmetWorldHeight = accBoundsSize.y;
  const helmetWorldMinY = postScaleRobustBox.min.y;
  const helmetWorldMaxY = postScaleRobustBox.max.y;
  const scaleRatio = helmetWorldHeight / (headWorldHeight || 0.1);

  // Head top Y (for floating check)
  let headWorldTopY = 0;
  let headWorldCenterY = 0;
  if (headPart) {
      headWorldTopY = headPart.maxY;
      headWorldCenterY = headPart.center.y;
  }

  const passDistance = anchorToFinalDist <= 0.25;
  const passScale = scaleRatio >= 0.85 && scaleRatio <= 1.6;

  // BAĞIMSIZ KEY DOĞRULAMASI
  const actualSourceKey = sourceKeyFromFlutter || 'UNKNOWN';
  const mapKeys = Object.keys(attachedAccessories);
  const mapKeyForThisGroup = mapKeys.find(k => attachedAccessories[k].group === accGroup) || 'NOT_FOUND';
  const passKeyMatch = (actualSourceKey === slotId) && (slotId === mapKeyForThisGroup);

  // ZORUNLU DEBUG CONTRACT
  const traceId = 'TRC_' + Math.random().toString(36).substring(2, 7).toUpperCase();
  console.log(`[attachAccessory][${traceId}] DEBUG_CONTRACT: ` + JSON.stringify({
    sourceKeyFromFlutter: actualSourceKey,
    slotRequested: slotId,
    transformKeyInMap: mapKeyForThisGroup,
    attachType: attachType,
    attachmentNodeFound: attachType !== 'fallback',
    nodeName: targetNode ? targetNode.name : 'N/A',
    meshCount: accMeshCount,
    anchorWorldPos: {x: +anchorWorldPos.x.toFixed(4), y: +anchorWorldPos.y.toFixed(4), z: +anchorWorldPos.z.toFixed(4)},
    finalWorldPos: {x: +finalWorldPos.x.toFixed(4), y: +finalWorldPos.y.toFixed(4), z: +finalWorldPos.z.toFixed(4)},
    anchorToFinalDist: +anchorToFinalDist.toFixed(4),
    accRawBounds: {x: +accSizeRaw.x.toFixed(3), y: +accSizeRaw.y.toFixed(3), z: +accSizeRaw.z.toFixed(3)},
    preScaleRobustMaxDim: +accWorldMaxDim.toFixed(3),
    scaleFactor: +scaleFactor.toFixed(4),
    helmetWorldMinY: +helmetWorldMinY.toFixed(4),
    helmetWorldMaxY: +helmetWorldMaxY.toFixed(4),
    helmetWorldHeight: +helmetWorldHeight.toFixed(4),
    headWorldHeight: +headWorldHeight.toFixed(4),
    headWorldCenterY: +headWorldCenterY.toFixed(4),
    headWorldTopY: +headWorldTopY.toFixed(4),
    scaleRatio: +scaleRatio.toFixed(3),
    chosenPlacementMode: chosenPlacementMode,
    pass: {
        distance: passDistance,
        scale: passScale,
        keyMatch: passKeyMatch
    }
  }));

  if (!passDistance || !passScale || !passKeyMatch) {
     console.error(`[attachAccessory][${traceId}] FAIL: d=${passDistance} s=${passScale} k=${passKeyMatch}`);
  }

  window.flutter_inappwebview?.callHandler('onAccessoryAttached', slotId);
}

// Accessory loader — receives base64 GLB data from Dart
// sourceKeyFromFlutter is the INDEPENDENT key from Dart layer for telemetry
window.attachAccessoryFromBase64 = function(base64Data, slotId, sourceKeyFromFlutter) {
  console.log('[attachAccessory] Parsing base64, slot:', slotId, 'sourceKey:', sourceKeyFromFlutter);
  // Remove previous
  if (attachedAccessories[slotId]) {
    const prev = attachedAccessories[slotId];
    prev.parent.remove(prev.group);
    delete attachedAccessories[slotId];
  }
  if (!currentModel) {
    console.warn('[attachAccessory] No mannequin loaded, cannot attach.');
    return;
  }
  try {
    const buffer = base64ToArrayBuffer(base64Data);
    loader.parse(buffer, '', (gltf) => {
      processLoadedAccessory(gltf, slotId, sourceKeyFromFlutter);
    }, (err) => {
      console.error('[attachAccessory] Parse error:', err);
    });
  } catch (e) {
    console.error('[attachAccessory] Base64 decode error:', e);
  }
};

window.updateAccessoryTransform = function(slotId, x, y, z, rx, ry, rz, s) {
  const acc = attachedAccessories[slotId];
  if (!acc) {
    console.warn(`[updateTransform] NO ENTRY for key="${slotId}". Available keys: ${Object.keys(attachedAccessories).join(', ')}`);
    return;
  }

  // Capture BEFORE world position
  const beforePos = new THREE.Vector3();
  acc.group.getWorldPosition(beforePos);

  // Apply user offset ON TOP of the base slot offset
  acc.group.position.set(
    acc.baseOffset.x + x,
    acc.baseOffset.y + y,
    (acc.baseOffset.z || 0) + z
  );
  acc.group.rotation.set(
    THREE.MathUtils.degToRad(rx),
    THREE.MathUtils.degToRad(ry),
    THREE.MathUtils.degToRad(rz)
  );
  acc.group.scale.setScalar(s);

  // Capture AFTER world position
  acc.group.updateMatrixWorld(true);
  const afterPos = new THREE.Vector3();
  acc.group.getWorldPosition(afterPos);
  const delta = beforePos.distanceTo(afterPos);

  console.log(`[updateTransform] key="${slotId}" sourceKey="${acc._sourceKeyFromFlutter}" ` +
    `before={y:${beforePos.y.toFixed(4)}} after={y:${afterPos.y.toFixed(4)}} delta=${delta.toFixed(4)} ` +
    `input={x:${x},y:${y},z:${z}} actionMoved=${delta > 0.001}`);
};

  }
};

window.setCameraOrbit = function(theta, phi, distance) {
  const t = THREE.MathUtils.degToRad(theta);
  const p = THREE.MathUtils.degToRad(phi);
  camera.position.set(
    distance * Math.sin(p) * Math.cos(t) / 100,
    distance * Math.cos(p) / 100,
    distance * Math.sin(p) * Math.sin(t) / 100
  );
  controls.update();
};

window.applyRegionColor = function(region, hexColor) {
  if (!currentModel) return;
  var color = new THREE.Color(hexColor);
  var regionParts = {
    'upper': SHIRT_PARTS,
    'lower': PANTS_PARTS,
    'head':  [],
    'all':   ALL_CLOTHING_PARTS
  };
  var allowedParts = regionParts[region];
  if (allowedParts === undefined) {
    console.warn('[applyRegionColor] Unknown region: ' + region);
    return;
  }
  var applied = 0;
  currentModel.traverse(function(child) {
    if (!child.isMesh) return;
    var part = resolveBodyPart(child);
    if (!part) return;
    // PROTECT SKIN — never color skin parts
    if (SKIN_PARTS.indexOf(part) !== -1) return;
    // Only color parts in the allowed list
    if (allowedParts.indexOf(part) === -1) return;
    if (child.material.map) {
      child.material.color = color;
    } else {
      child.material = new THREE.MeshStandardMaterial({
        color: color, roughness: 0.6, metalness: 0.1,
      });
    }
    child.material.needsUpdate = true;
    applied++;
  });
  console.log('[applyRegionColor] region=' + region + ' color=' + hexColor + ' applied=' + applied);
};

// Apply color to ALL clothing regions at once (SKIN protected).
window.applyClothingColor = function(hexColor) {
  if (!currentModel) return;
  var color = new THREE.Color(hexColor);
  var applied = 0;
  currentModel.traverse(function(child) {
    if (!child.isMesh) return;
    var part = resolveBodyPart(child);
    if (!part) return;
    // PROTECT SKIN — never color skin parts
    if (SKIN_PARTS.indexOf(part) !== -1) return;
    // Only clothing parts
    if (ALL_CLOTHING_PARTS.indexOf(part) === -1) return;
    if (child.material.map) {
      child.material.color = color;
    } else {
      child.material = new THREE.MeshStandardMaterial({
        color: color, roughness: 0.6, metalness: 0.1,
      });
    }
    child.material.needsUpdate = true;
    applied++;
  });
  console.log('[applyClothingColor] color=' + hexColor + ' applied=' + applied);
};

// ─── CAMERA VIEW ANGLE API ────────────────────────────────────────
// Smoothly rotate camera to front (0°) or back (180°) view
window.setViewAngle = function(angleDeg) {
  const target = controls.target.clone();
  const dist = camera.position.distanceTo(target);
  const rad = THREE.MathUtils.degToRad(angleDeg);
  const newPos = new THREE.Vector3(
    target.x + dist * Math.sin(rad) * 0.3,
    camera.position.y,
    target.z + dist * Math.cos(rad)
  );
  const startPos = camera.position.clone();
  const startTime = performance.now();
  const duration = 500;
  function animateCamera(time) {
    const t = Math.min((time - startTime) / duration, 1);
    const ease = t * (2 - t);
    camera.position.lerpVectors(startPos, newPos, ease);
    controls.update();
    if (t < 1) requestAnimationFrame(animateCamera);
  }
  requestAnimationFrame(animateCamera);

  // viewSide truth logging
  var viewSide = 'unknown';
  if (currentModel) {
    var fn = currentModel.getObjectByName('BodyFrontAttachment');
    var bn = currentModel.getObjectByName('BodyBackAttachment');
    if (fn && bn) {
      var fp = new THREE.Vector3(), bp = new THREE.Vector3();
      fn.getWorldPosition(fp); bn.getWorldPosition(bp);
      var df = newPos.distanceTo(fp), db = newPos.distanceTo(bp);
      viewSide = df < db ? 'front' : 'back';
      console.log('[truth] setViewAngle=' + angleDeg + ' viewSide=' + viewSide +
        ' frontDist=' + df.toFixed(3) + ' backDist=' + db.toFixed(3));
    }
  }
  console.log('[setViewAngle]', angleDeg,
    'cameraPos=(', newPos.x.toFixed(3), newPos.y.toFixed(3), newPos.z.toFixed(3), ')',
    'viewSide=' + viewSide);
};

// ─── FRONT/BACK PROBE TEXTURE (V11.1) ─────────────────────────────────
// Paints the FULL torso template rows so probe works for both classic_uv
// and GLB UV rewrite paths.
//
// Template torso layout (L→R): RIGHT | FRONT | LEFT | BACK
//   GLB face table:  R(164,66) | F(231,130) | L(362,64) | B(427,130)
//   classic_uv:      R(0,105)  | F(105,220) | L(325,105)| B(430,155)
//
// We paint the FULL strip for maximum coverage:
//   GREEN "FRONT" across x=105..362 (covers both tables' front region)
//   RED   "BACK"  across x=427..585 (covers both tables' back region)
//   BLUE  "R"     across x=0..164
//   YELLOW "L"    across x=325..427
window.runFrontBackProbe = function() {
  var TW = 585, TH = 559;
  var pc = document.createElement('canvas');
  pc.width = TW; pc.height = TH;
  var pctx = pc.getContext('2d');

  // Gray base
  pctx.fillStyle = '#888888';
  pctx.fillRect(0, 0, TW, TH);

  // RIGHT: x=0 to x=163 (full height torso area y=0..270)
  pctx.fillStyle = '#0055FF';
  pctx.fillRect(0, 0, 164, 270);
  pctx.fillStyle = '#FFFFFF'; pctx.font = 'bold 28px monospace'; pctx.textAlign = 'center';
  pctx.fillText('R', 82, 95);

  // FRONT: x=105 to x=362 (overlapping right edge is ok, drawn after)
  pctx.fillStyle = '#00CC44';
  pctx.fillRect(105, 0, 257, 270);
  pctx.fillStyle = '#FFFFFF'; pctx.font = 'bold 48px monospace';
  pctx.fillText('FRONT', 233, 100);

  // LEFT: x=325 to x=427
  pctx.fillStyle = '#CCCC00';
  pctx.fillRect(325, 0, 102, 270);
  pctx.fillStyle = '#000000'; pctx.font = 'bold 28px monospace';
  pctx.fillText('L', 376, 95);

  // BACK: x=427 to x=585
  pctx.fillStyle = '#CC0000';
  pctx.fillRect(427, 0, 158, 270);
  pctx.fillStyle = '#FFFFFF'; pctx.font = 'bold 48px monospace';
  pctx.fillText('BACK', 506, 100);

  var dataUrl = pc.toDataURL('image/png');
  var base64 = dataUrl.split(',')[1];

  // Log attachment world positions
  if (currentModel) {
    var fn = currentModel.getObjectByName('BodyFrontAttachment');
    var bn = currentModel.getObjectByName('BodyBackAttachment');
    var fp = new THREE.Vector3(), bp = new THREE.Vector3();
    if (fn) fn.getWorldPosition(fp);
    if (bn) bn.getWorldPosition(bp);
    console.log('[probe] bodyFrontAttachment_world=(' +
      fp.x.toFixed(3) + ',' + fp.y.toFixed(3) + ',' + fp.z.toFixed(3) + ')');
    console.log('[probe] bodyBackAttachment_world=(' +
      bp.x.toFixed(3) + ',' + bp.y.toFixed(3) + ',' + bp.z.toFixed(3) + ')');
  }
  console.log('[probe] camera_pos=(' +
    camera.position.x.toFixed(3) + ',' + camera.position.y.toFixed(3) + ',' + camera.position.z.toFixed(3) + ')');
  console.log('[probe] mannequinSource=' + _mannequinSource);
  console.log('[probe] FRONT_REGION=green(x105-362) BACK_REGION=red(x427-585)');
  console.log('[probe] PASS_CONDITION: angle=0 shows green FRONT, angle=180 shows red BACK');

  // Apply probe texture
  window.applyClassicTexture(base64, 'set');
  console.log('[probe] probe texture applied via applyClassicTexture');
};

// ─── PROBE WITH ASSERTION (V9) ───────────────────────────────────────
// Runs probe, then at angle=0 and 180 reads center pixel color to assert.
window.runProbeWithAssert = function() {
  window.runFrontBackProbe();
  // Wait for texture to apply + render
  setTimeout(function() {
    // angle=0 (camera at +Z, looking at front)
    window.setViewAngle(0);
    setTimeout(function() {
      // Read center pixel
      renderer.render(scene, camera);
      var w = renderer.domElement.width;
      var h = renderer.domElement.height;
      var buf = new Uint8Array(4);
      var gl = renderer.getContext();
      gl.readPixels(Math.floor(w/2), Math.floor(h/2), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, buf);
      var r0 = buf[0], g0 = buf[1], b0 = buf[2];
      var frontAt0 = (g0 > r0 && g0 > b0); // green = FRONT
      console.log('[probe-face] angle=0 pixel=(' + r0 + ',' + g0 + ',' + b0 + ') visible=' + (frontAt0 ? 'FRONT' : (r0 > g0 ? 'BACK' : 'unknown')));

      // angle=180
      window.setViewAngle(180);
      setTimeout(function() {
        renderer.render(scene, camera);
        gl.readPixels(Math.floor(w/2), Math.floor(h/2), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, buf);
        var r1 = buf[0], g1 = buf[1], b1 = buf[2];
        var backAt180 = (r1 > g1 && r1 > b1); // red = BACK
        console.log('[probe-face] angle=180 pixel=(' + r1 + ',' + g1 + ',' + b1 + ') visible=' + (backAt180 ? 'BACK' : (g1 > r1 ? 'FRONT' : 'unknown')));

        var pass = frontAt0 && backAt180;
        console.log('[uv-assert] frontAt0=' + frontAt0 + ' backAt180=' + backAt180 + ' result=' + (pass ? 'pass' : 'FAIL'));
        if (!pass) {
          console.error('[uv-assert] FRONT/BACK INVERSION DETECTED. Swap needed in buildClassicClothingMannequin UV.');
        }

        // Return to front view
        window.setViewAngle(0);
      }, 700);
    }, 700);
  }, 300);
};

// NOTE: Model loading is triggered from Dart (onLoadStop) — not auto-loaded here.
// This prevents race conditions and ensures the WebView security context is ready.

// ─── Animate ─────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
